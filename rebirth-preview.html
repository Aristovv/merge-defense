(()=>{

const START=[0,1,2,3,4],defaultState=()=>({wave:1,hp:20,coins:500,gems:50,mana:160,deck:[...START],unlocked:[...START,5,6,7],board:Array(15).fill(null),upgrade:0,wins:0,kills:0,highest:1});
let d=defaultState();try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p&&Array.isArray(p.board)&&p.board.length===15){d={...d,...p};d.deck=Array.isArray(p.deck)&&p.deck.length===5?p.deck:[...START];d.unlocked=Array.isArray(p.unlocked)?p.unlocked:[...START,5,6,7];d.board=p.board.map(x=>x&&Number.isInteger(x.hero)&&x.hero>=0&&x.hero<HEROES.length&&x.rank>=1&&x.rank<=7?{hero:x.hero,rank:x.rank}:null)}}}catch(e){console.warn('Preview save unavailable',e)}

const canvas=$('field'),ctx=canvas.getContext('2d');let W=400,H=350,enemyId=0,enemies=[],shots=[],effects=[],running=false,spawned=0,waveTotal=0,spawnClock=0,selected=-1,speed=1,last=0,time=0,modal=false,spellCD={fire:0,freeze:0,shock:0},dragFrom=-1;

for(let i=0;i<40;i++){const x=((i*79+37)%101)/101*W,y=((i*41+17)%97)/97*H;ctx.fillStyle=i%3?'#6dba91':'#9ac9a3';ctx.globalAlpha=.25;ctx.beginPath();ctx.ellipse(x,y,3+(i%4),2+(i%3),i,0,7);ctx.fill()}ctx.globalAlpha=1;
path();ctx.strokeStyle='#0e515c';ctx.lineWidth=59;ctx.stroke();path();ctx.strokeStyle='#72b4a5';ctx.lineWidth=48;ctx.stroke();path();ctx.strokeStyle='#e2cfa3';ctx.lineWidth=37;ctx.stroke();path();ctx.strokeStyle='#f6e7bf';ctx.lineWidth=29;ctx.stroke();
ctx.strokeStyle='#fff7d3';ctx.globalAlpha=.55;ctx.lineWidth=1.5;ctx.setLineDash([4,14]);path();ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
for(const e of enemies){const p=pos(e.t),r=e.boss?19:e.elite?13:10;ctx.save();ctx.translate(p.x,p.y);ctx.shadowColor=e.boss?'#ff8b7b':'#3e1526';ctx.shadowBlur=e.boss?17:6;ctx.fillStyle=e.boss?'#82385e':e.kind==='runner'?'#b66a51':e.kind==='armored'?'#556b86':'#714b74';ctx.strokeStyle=e.boss?'#ffd48e':'#f3bb9e';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.font=(e.boss?21:13)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e.boss?'👹':e.kind==='runner'?'🐺':e.kind==='armored'?'🛡️':'👾',0,0);ctx.fillStyle='#401e30';ctx.fillRect(-r,-r-10,r*2,4);ctx.fillStyle=e.boss?'#ffbc7a':'#a9f1be';ctx.fillRect(-r,-r-10,r*2*clamp(e.hp/e.max,0,1),4);ctx.restore()}
for(const s of shots){ctx.fillStyle=s.color;ctx.shadowColor=s.color;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(s.x,s.y,4,0,7);ctx.fill();ctx.shadowBlur=0}
for(const p of effects){ctx.globalAlpha=clamp(p.life/.5,0,1);ctx.strokeStyle=p.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,p.radius*(1-p.life/.5),0,7);ctx.stroke()}ctx.globalAlpha=1;
ctx.fillStyle='#0e263fbb';ctx.fillRect(8,8,Math.min(W-16,225),27);ctx.font='bold 12px system-ui';ctx.fillStyle='#d9fff0';ctx.fillText(running?'⚔️ Бой · '+(waveTotal-spawned+enemies.length)+' осталось':'🛡️ Подготовка к волне',18,26)}
function renderBoard(){const el=$('board');el.innerHTML='';for(let i=0;i<15;i++){const t=d.board[i],node=document.createElement('div');node.className='cell'+(!t?' empty':'')+(selected===i?' selected':'')+(selected>=0&&t&&d.board[selected]&&i!==selected&&t.hero===d.board[selected].hero&&t.rank===d.board[selected].rank?' match':'');node.dataset.slot=i;if(t){const h=HEROES[t.hero];node.innerHTML='<div class="unit" style="--shine:'+h.color+'">'+h.icon+'<span class="rank">'+t.rank+'</span>'+(t.rank>=4?'<small>★</small>':'')+'</div>'}node.onclick=()=>clickCell(i);node.addEventListener('pointerdown',()=>{dragFrom=i});node.addEventListener('pointerup',e=>{if(dragFrom>=0&&dragFrom!==i){selected=dragFrom;clickCell(i)}dragFrom=-1});el.append(node)}}
function clickCell(i){const t=d.board[i];if(selected<0){if(t){selected=i;toast('Выбери пустую клетку для перемещения или такую же башню для слияния')}else toast('Сначала выбери башню');renderBoard();return}
if(i===selected){selected=-1;renderBoard();return}
const from=d.board[selected];if(!from){selected=-1;renderBoard();return}
if(!t){d.board[i]=from;d.board[selected]=null;toast('Башня перемещена')}
else if(t.hero===from.hero&&t.rank===from.rank&&t.rank<7){const next=d.deck[Math.floor(Math.random()*d.deck.length)];d.board[i]={hero:next,rank:t.rank+1};d.board[selected]=null;effects.push({x:W/2,y:H*.75,life:.5,radius:90,color:HEROES[next].color});toast('✨ Слияние! '+HEROES[next].name+' · ранг '+(t.rank+1))}
else{selected=i;toast('Для слияния нужны одинаковые персонажи и ранги');renderBoard();return}
selected=-1;save();hud()}
function summon(){const free=d.board.map((t,i)=>t?-1:i).filter(i=>i>=0),cost=40+Math.floor(d.board.filter(Boolean).length/3)*20;if(!free.length){toast('Поле заполнено — объединяй башни');return}if(d.mana<cost){toast('Недостаточно маны');return}d.mana-=cost;const hero=d.deck[Math.floor(Math.random()*d.deck.length)],slot=free[Math.floor(Math.random()*free.length)];d.board[slot]={hero,rank:1};if(hero===8)d.mana+=20;save();hud();toast('✨ Призван '+HEROES[hero].name)}
function begin(){if(running||modal)return;if(!d.board.some(Boolean)){toast('Призови хотя бы одного героя');return}running=true;spawned=0;spawnClock=0;waveTotal=8+d.wave*3;enemies=[];shots=[];toast(d.wave%5===0?'⚠️ Внимание: волна с боссом!':'⚔️ Волна началась');hud()}
function enemySpawn(){const boss=d.wave%5===0&&spawned===waveTotal-1;const kind=boss?'boss':spawned%6===0?'armored':spawned%4===0?'runner':'grunt';const hp=(30+d.wave*18)*(boss?8:kind==='armored'?1.6:1);enemies.push({id:++enemyId,t:0,hp,max:hp,boss,kind,elite:false,slow:0,poison:0,weak:0,speed:(kind==='runner'?.062:.045)*(boss?.55:1)*(1+d.wave*.025),phase:1});spawned++}
function hitEnemy(e,amount,hero){const h=HEROES[hero];let damage=amount*(e.kind==='armored'&&hero!==6?.72:1);if(hero===5&&e.hp<e.max*.5)damage*=1.65;if(hero===11&&e.boss)damage*=1.6;if(e.weak>0)damage*=1.2;e.hp-=damage;if(hero===1)e.slow=Math.max(e.slow,2.2);if(hero===3)e.poison=Math.max(e.poison,3.6);if(hero===10)e.weak=Math.max(e.weak,3);if(hero===2){let n=0;for(const o of enemies)if(o!==e&&Math.abs(o.t-e.t)<.12&&n++<2)o.hp-=damage*.32}if(hero===0){for(const o of enemies)if(o!==e&&Math.abs(o.t-e.t)<.07)o.hp-=damage*.3}}
let cooldown=Array(15).fill(0);
function step(dt){time+=dt;for(const k of Object.keys(spellCD))spellCD[k]=Math.max(0,spellCD[k]-dt);for(const e of effects)e.life-=dt;effects=effects.filter(x=>x.life>0);if(!running)return;
spawnClock+=dt;if(spawned<waveTotal&&spawnClock>.8){spawnClock=0;enemySpawn()}
for(const e of enemies){e.t+=dt*e.speed*(e.slow>0?.5:1);e.slow=Math.max(0,e.slow-dt);e.poison=Math.max(0,e.poison-dt);e.weak=Math.max(0,e.weak-dt);if(e.poison>0)e.hp-=dt*(6+d.wave*1.3);if(e.boss){const phase=e.hp/e.max<.33?3:e.hp/e.max<.67?2:1;if(phase>e.phase){e.phase=phase;e.speed*=1.14;toast('👹 Босс перешёл в фазу '+phase)}}}
for(let i=0;i<15;i++){const t=d.board[i];if(!t)continue;cooldown[i]-=dt;if(cooldown[i]>0)continue;const targets=enemies.filter(e=>e.t<1&&e.hp>0);if(!targets.length)continue;targets.sort((a,b)=>b.t-a.t);const target=targets[0],h=HEROES[t.hero],boost=1+d.upgrade*.17,rank=1+(t.rank-1)*.72;let rate=h.rate;const x=i%5,y=Math.floor(i/5);for(let j=0;j<15;j++){const o=d.board[j];if(!o||j===i)continue;if(Math.abs(j%5-x)+Math.abs(Math.floor(j/5)-y)!==1)continue;if(o.hero===9)rate*=.92;if(o.hero===7)boost*=1.04}cooldown[i]=Math.max(.18,rate/rank);const damage=h.damage*boost*rank;hitEnemy(target,damage,t.hero);const p=pos(target.t);shots.push({x:p.x,y:p.y,color:h.color,life:.17})}

for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(e.hp<=0){enemies.splice(i,1);d.kills++;d.mana+=e.boss?130:11+d.wave*2;d.coins+=e.boss?100:4;const p=pos(e.t);effects.push({x:p.x,y:p.y,life:.5,radius:e.boss?60:22,color:e.boss?'#ffc478':'#b1ffd1'})}else if(e.t>=1){enemies.splice(i,1);d.hp-=e.boss?5:1;if(d.hp<=0){d.hp=20;running=false;d.wave=1;d.upgrade=0;toast('💔 База разрушена — новый поход');save();hud();return}}}
if(spawned>=waveTotal&&enemies.length===0){running=false;d.wins++;d.gems+=d.wave%5===0?15:3;d.coins+=75+d.wave*12;d.wave=d.wave===10?1:d.wave+1;d.highest=Math.max(d.highest,d.wave);d.upgrade=0;d.mana+=100;toast('🏆 Победа! Получены награды');save();hud();return}
hud(false)}
function spell(type){if(!running||spellCD[type]>0)return;const target=enemies.filter(e=>e.hp>0);if(!target.length){toast('Врагов пока нет');return}const cool={fire:14,freeze:17,shock:19};spellCD[type]=cool[type];for(const e of target){if(type==='fire')e.hp-=65+d.wave*9;else if(type==='freeze')e.slow=Math.max(e.slow,3.5);else e.hp-=43+d.wave*6}effects.push({x:W/2,y:H*.45,life:.5,radius:130,color:type==='fire'?'#ffab6b':type==='freeze'?'#8bdfff':'#e5bcff'});toast(type==='fire'?'🔥 Огненный шторм':type==='freeze'?'❄️ Массовая заморозка':'⚡ Цепная гроза')}
function hud(board=true){$('coins').textContent='🪙 '+d.coins;$('gems').textContent='💎 '+d.gems;$('hp').textContent='❤️ '+d.hp;$('mana').textContent='🔮 Мана '+d.mana;$('wave').textContent='Волна '+d.wave+'/10';$('foecount').textContent='⚔️ '+enemies.length+' врагов';$('progress').style.width=(running?Math.round(100*spawned/Math.max(1,waveTotal)):0)+'%';$('power').textContent='✨ Сила '+d.board.reduce((a,t)=>a+(t?Math.round(HEROES[t.hero].damage*(1+(t.rank-1)*.72)):0),0);$('summon').textContent='✨ Призвать · 🔮 '+(40+Math.floor(d.board.filter(Boolean).length/3)*20);$('summon').disabled=d.mana<40+Math.floor(d.board.filter(Boolean).length/3)*20||d.board.every(Boolean);$('start').textContent=running?'⚔️ Бой идёт':'▶ Начать волну';$('start').disabled=running;$('upgrade').textContent='⬆️ Сила '+(d.upgrade+1);$('upgrade').disabled=d.mana<65+d.upgrade*40||d.upgrade>=5;$('speed').textContent='⏩ ×'+speed;for(const k of Object.keys(spellCD))$(k).disabled=!running||spellCD[k]>0;const boss=enemies.find(e=>e.boss);$('bosswrap').classList.toggle('hide',!boss);if(boss){$('bosslabel').textContent='👹 БОСС · ФАЗА '+boss.phase+'/3';$('bosshp').style.width=clamp(boss.hp/boss.max*100,0,100)+'%'}if(board)renderBoard()}
function deckMenu(){if(running){toast('Колоду можно менять только между волнами');return}const body='<p>Выбери <b>ровно 5</b> разных персонажей. Именно они будут выпадать при призыве. Доступные карты отмечены цветом.</p><div class="cards">'+HEROES.map((h,i)=>'<button class="card '+(d.deck.includes(i)?'chosen':'')+'" data-hero="'+i+'" '+(!d.unlocked.includes(i)?'disabled':'')+'><span class="art">'+h.icon+'</span><strong>'+h.name+'</strong><small>'+h.role+'</small><small>'+(d.deck.includes(i)?'✓ В колоде':d.unlocked.includes(i)?'Нажми, чтобы выбрать':'🔒 Закрыт')+'</small></button>').join('')+'</div><p class="tag">Карты можно открывать в коллекции за игровые монеты. Данные версии 6.6 не изменяются.</p>';open('🃏 Моя колода · '+d.deck.length+'/5',body);document.querySelectorAll('[data-hero]').forEach(b=>b.onclick=()=>{const id=+b.dataset.hero;if(d.deck.includes(id)){if(d.deck.length<=5){toast('Сначала выбери замену из доступных карт');return}}else{d.deck=[...d.deck.slice(1),id];save();deckMenu()}})}
function collection(){const body='<p>У каждого героя своя атака и роль. Открывай новых героев за монеты, собирай разные колоды.</p><div class="cards">'+HEROES.map((h,i)=>'<div class="card"><span class="art">'+h.icon+'</span><strong>'+h.name+'</strong><small>'+h.trait+'</small><small>'+(d.unlocked.includes(i)?'✓ Открыт':'🔒 Цена: '+(450+i*80)+' 🪙')+'</small>'+(!d.unlocked.includes(i)?'<button class="btn" data-unlock="'+i+'">Открыть</button>':'')+'</div>').join('')+'</div>';open('📚 Коллекция героев',body);document.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=()=>{const id=+b.dataset.unlock,price=450+id*80;if(d.coins<price){toast('Недостаточно монет');return}d.coins-=price;d.unlocked.push(id);save();hud();collection()})}
$('tabdeck').onclick=deckMenu;$('tabcollection').onclick=collection;$('tabbattle').onclick=()=>{close();toast('⚔️ Перетащи одинаковых героев друг на друга')};$('summon').onclick=summon;$('start').onclick=begin;$('speed').onclick=()=>{speed=speed===1?2:speed===2?3:1;hud()};$('upgrade').onclick=()=>{const cost=65+d.upgrade*40;if(d.mana<cost||d.upgrade>=5)return;d.mana-=cost;d.upgrade++;save();hud();toast('⬆️ Урон всех героев усилен')};for(const k of ['fire','freeze','shock'])$(k).onclick=()=>spell(k);
function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;step(dt*speed);draw();requestAnimationFrame(frame)}
resize();hud();requestAnimationFrame(frame);toast('🃏 Собери колоду из 5 героев — затем призывай и объединяй');
})();
</script></body></html>
