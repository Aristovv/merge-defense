function shopScreen(){return '<div class="page"><div class="section-intro"><div><span class="eyebrow">CASINO CITY · VIP</span><h1>Премиум-магазин</h1></div><span class="catalog-count">СКОРО</span></div><div class="panel"><h3>Премиум-витрина</h3><p class="subline">Каталог будущих покупок. Оплата пока не подключена: никаких списаний, обещаний выдачи и фиктивных покупок.</p></div><div class="shop-grid">'+[['Королевский VIP','Эксклюзивная рамка профиля и золотая тема','♛'],['Золотой город','Особый внешний вид городских зданий','◆'],['Коллекция Royale','Редкие декоративные предметы','✦'],['Пропуск сезона','Косметические награды и оформление','★'],['Набор фишек','Будущая покупка фишек после проверки оплаты','◈'],['Премиум-профиль','Золотой бейдж и особое оформление имени','♕']].map(x=>'<div class="shop-item"><div class="shop-symbol">'+x[2]+'</div><strong>'+x[0]+'</strong><p>'+x[1]+'</p><span class="shop-disabled">Недоступно до подключения VK Pay</span></div>').join('')+'</div><div class="note">Настоящие покупки появятся только после серверной проверки платежей и настройки VK. Сейчас это безопасная демонстрация ассортимента.</div></div>'}
function render(){if(tab==='game'&&selected<0)tab='games';$('app').innerHTML=mainHeader()+(tab==='city'?cityScreen():tab==='games'?gamesScreen():tab==='game'?gameScreen():tab==='collection'?collectionScreen():tab==='quests'?questsScreen():tab==='top'?topScreen():tab==='shop'?shopScreen():profileScreen())+navbar();}
function claimQuest(i){let req=[state.plays>=5,state.plays>=20,state.wins>=10,state.buildings.reduce((a,b)=>a+b,0)>=4,state.level>=5];if(state.quests.includes(i)||!req[i])return;state.quests.push(i);grant([150,500,600,400,1000][i]);render();message('Награда получена')}
function switchTab(t){if(busy&&tab==='game'){message('Сначала закончи игру');return}lastSlotResult=null;if(crashTimer){clearInterval(crashTimer);crashTimer=null;busy=false}tab=t;selected=t==='game'?selected:-1;round=null;render();window.scrollTo(0,0)}
document.addEventListener('input',function(e){if(e.target?.id==='cashout-amount')updateCashoutPreview();if(e.target?.id==='coin-exchange-amount')updateCoinExchangePreview()});
let scratchDragging=false;
function scratchAtPoint(x,y){const el=document.elementFromPoint(x,y)?.closest('[data-scratch]');if(el&&round?.kind==='scratch')scratchOpen(Number(el.dataset.scratch))}
document.addEventListener('touchstart',e=>{if(e.target.closest('.scratches')){scratchDragging=true;const t=e.touches[0];if(t)scratchAtPoint(t.clientX,t.clientY)}},{passive:true});
document.addEventListener('touchmove',e=>{if(!scratchDragging)return;const t=e.touches[0];if(t)scratchAtPoint(t.clientX,t.clientY)},{passive:true});
document.addEventListener('touchend',()=>{scratchDragging=false});document.addEventListener('touchcancel',()=>{scratchDragging=false});
document.addEventListener('mousedown',e=>{if(e.target.closest('.scratches'))scratchDragging=true});
document.addEventListener('mousemove',e=>{if(scratchDragging&&e.buttons===1)scratchAtPoint(e.clientX,e.clientY)});
document.addEventListener('mouseup',()=>{scratchDragging=false});
document.addEventListener('click',function(e){let x=e.target.closest('button');if(!x||x.disabled)return;const d=x.dataset;if(d.tab)return switchTab(d.tab);if(d.back!==undefined)return switchTab('games');if(d.game!==undefined){if(busy)return;lastSlotResult=null;slotLastWins=0;selected=Number(d.game);tab='game';round=null;held=[];kenoSelected=[];kenoLastDraw=[];crashValue=1;render();window.scrollTo(0,0);return}if(d.plinkoRisk!==undefined){if(busy)return;plinkoRisk=Math.max(0,Math.min(2,Number(d.plinkoRisk)||0));plinkoLastSector=-1;plinkoHits=[];render();return}if(d.plinkoCount!==undefined){if(busy)return;plinkoCount=Math.max(1,Math.min(10,Number(d.plinkoCount)||1));render();return}if(d.up!==undefined)return buildingUp(Number(d.up));if(d.pick){if(busy)return;roulettePick=d.pick;render();return}if(d.hold!==undefined){if(busy)return;let i=Number(d.hold);held=held.includes(i)?held.filter(a=>a!==i):held.concat(i);render();return}if(d.keno!==undefined)return selectKeno(Number(d.keno));if(d.scratch!==undefined)return scratchOpen(Number(d.scratch));if(d.quest!==undefined)return claimQuest(Number(d.quest));const a=d.action;if(!a)return;switch(a){case'district':expandedDistrict=!expandedDistrict;render();break;case'collect':{let got=collectPassive();render();message(got?'Собрано '+fmt(got)+' монет':'Доход ещё накапливается');break}case'daily':daily();break;case'exchange':exchange();break;case'cashout':cashout();break;case'betdown':if(!busy&&!round){bet=Math.max(5,Math.floor(bet/2/5)*5);render()}break;case'betup':if(!busy&&!round){bet=Math.min(500,bet*2);render()}break;case'slot':playSlot();break;case'roulette':playRoulette();break;case'bjstart':startBlackjack();break;case'hit':hit();break;case'stand':stand();break;case'pokerstart':pokerStart();break;case'pokerdraw':pokerDraw();break;case'kenoplay':kenoPlay();break;case'kenoquick':kenoQuickPick();break;case'hilostart':hiloStart();break;case'higher':hiloPlay(true);break;case'lower':hiloPlay(false);break;case'plinko':plinkoPlay();break;case'crashstart':crashStart();break;case'cashout':crashCash();break;case'under':dicePlay('under');break;case'over':dicePlay('over');break;case'scratchstart':scratchStart();break;case'scratchall':scratchRevealAll();break}})
const originalStartCost=startCost; // Preserve independent game round state; collection unlocks are awarded on completed parties.
window.addEventListener('pagehide',save);
setInterval(()=>{if(tab==='city'||tab==='profile'){let gained=collectPassive();if(gained&&tab==='city')render()}},30000);
render();
