function deckOdds(){

  odds[focus]=.5;
  for(const i of indices)if(i!==focus)odds[i]=.5/(indices.length-1);
 }else for(const i of indices)odds[i]=1/indices.length;
 return odds;
}

function resize(){const b=c.getBoundingClientRect(),scale=Math.min(2,window.devicePixelRatio||1);width=b.width;height=b.height;c.width=Math.round(width*scale);c.height=Math.round(height*scale);ctx.setTransform(scale,0,0,scale,0,0);tile=Math.min(width*.242,height*.145,82);gx=(width-tile*4)/2;gy=height-tile*3-17}function cell(e){const b=c.getBoundingClientRect(),i=Math.floor((e.clientX-b.left-gx)/tile),j=Math.floor((e.clientY-b.top-gy)/tile);return i>=0&&i<4&&j>=0&&j<3?j*4+i:-1}
c.addEventListener('pointerdown',e=>{const i=cell(e);if(i>=0){drag={from:i,x:e.offsetX,y:e.offsetY,moved:false};c.setPointerCapture(e.pointerId)}});

свеченные зелёным клетки означают возможность слияния. На пятой волне босс временно замедляет башни. У стихий разные роли: огонь поджигает, лёд замедляет (на боссов слабее), молния эффективнее против призраков, яд ослабляет регенерацию. Во время волны используй три способности с перезарядкой. За уничтожение врагов получай энергию: 60 единиц включают Импульс (+40% урона на 8 секунд). Разные стихии башен по соседству создают резонанс: +8% урона за каждую соседнюю башню другой стихии, максимум +24%. Это собственная механика игры «Легенды Башен». У боссов бывает защитный щит.</p><p class="note">Прогресс сохраняется на этом устройстве. Реальные платежи ещё не подключены.</p>')};$('tips').onclick=tacticsMenu;async function refreshServerGems(){

 try {

  }

}
async function openVKPurchase(item){

 if(!vkContext||!vkParams.get('sign'))return report('Покупка недоступна: игру нужно открыть через приложение ВКонтакте.');

 }
