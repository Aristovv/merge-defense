c.addEventListener('pointercancel',()=>drag=null);document.querySelectorAll('[data-spell]').forEach(b=>b.addEventListener('click',()=>cast(b.dataset.spell)));$('sellmode').onclick=()=>{if(busy){alert('Продавать башни можно между волнами');return}sellMode=!sellMode;selection=-1;$('sellmode').classList.toggle('active',sellMode);$('hint').textContent=sellMode?'Нажми на башню, которую хочешь продать':'Перетащи башню на другую или свободную клетку'};$('tips').onclick=()=>show('❔ Как играть','<p>Призывай башни нужной стихии. Объединяй башни одинакового вида и уровня, перетаскивая одну на другую.</p><p>Перетаскивание на пустую клетку перемещает башню. В режиме продажи коснись башни и подтверди получение монет.</p><p>Во время волны используй три способности с перезарядкой. У боссов бывает защитный щит.</p><p class="note">Прогресс сохраняется на этом устройстве. Реальные платежи ещё не подключены.</p>');function panel(tab){if(tab==='upgrade'){let a=170*(d.power+1),b=130*(d.income+1);show('⬆️ Прокачка','<div class="row"><div><b>⚔️ Мощь башен · '+d.power+'</b><p>+13% урона за уровень</p></div><button data-buy="power">🪙 '+a+'</button></div><div class="row"><div><b>🪙 Добыча · '+d.income+'</b><p>Больше монет за врагов</p></div><button data-buy="income">🪙 '+b+'</button></div>')}else if(tab==='collection'){const goals=[{id:'kills25',title:'⚔️ Охотник',desc:'Уничтожить 25 врагов',current:d.kills,goal:25,coins:200,gems:5},{id:'kills100',title:'🏹 Защитник',desc:'Уничтожить 100 врагов',current:d.kills,goal:100,coins:500,gems:12},{id:'merge3',title:'✨ Мастер слияния',desc:'Получить башню 3-го уровня',current:Math.max(d.bestLevel||1,...d.towers.map(t=>t.level)),goal:3,coins:250,gems:8},{id:'boss1',title:'👹 Победитель босса',desc:'Убить одного босса',current:d.bosses||0,goal:1,coins:350,gems:15}];show('🏆 Достижения','<button id="open-daily" style="width:100%;margin-bottom:10px;background:#a16b30;border-radius:12px;padding:13px;font-weight:800">🎁 Подарок дня и 3 ежедневных задания</button><button id="open-collection" style="width:100%;margin-bottom:12px;background:#7544ce;border-radius:12px;padding:13px;font-weight:800">📚 Коллекция башен ('+d.discovered.length+'/16) · Шанс легендарной 1%</button><p class="note">Призыв: обычная 70%, редкая 23%, эпическая 6%, легендарная 1%. После 9 обычных подряд следующий призыв гарантированно редкий или выше.</p>'+goals.map(g=>'<div class="row"><div><b>'+g.title+'</b><p>'+g.desc+' · '+Math.min(g.current,g.goal)+'/'+g.goal+'</p><p>Награда: 🪙 '+g.coins+' 💎 '+g.gems+'</p></div><button data-ach="'+g.id+'" '+(d.achievements.includes(g.id)||g.current<g.goal?'disabled':'')+'>'+(d.achievements.includes(g.id)?'Получено':g.current<g.goal?'Не готово':'Забрать')+'</button></div>').join('')+'<p class="note">Достижения доступны один раз. Прогресс хранится на устройстве.</p>');$('open-daily').onclick=dailyPanel;document.querySelectorAll('[data-ach]').forEach(b=>b.onclick=()=>{const g=goals.find(x=>x.id===b.dataset.ach);if(!g||g.current<g.goal||d.achievements.includes(g.id))return;d.achievements.push(g.id);d.coins+=g.coins;d.gems+=g.gems;save();hud();panel('collection');alert('Награда получена!')});$('open-collection').onclick=()=>{show('📚 Коллекция башен','<p class="note">Открыто '+d.discovered.length+' из 16 сочетаний. Доступные экземпляры: '+d.towers.length+'/12. Слияние требует одинаковую стихию, редкость и уровень.</p>'+[0,1,2,3].map(r=>'<h3 style="color:'+rarityColors[r]+'">'+rarityNames[r]+'</h3>'+names.map((name,t)=>{const owned=d.towers.filter(x=>x.type===t&&(x.rarity||0)===r);return '<div class="row"><div><b>'+signs[t]+' '+(d.discovered.includes(t+':'+r)?name:'???')+'</b><p>'+(d.discovered.includes(t+':'+r)?'Открыта · бонус урона ×'+rarityPower[r]:'Не найдена')+'</p></div><b>'+owned.length+' шт.'+(owned.length?' · ур. '+Math.max(...owned.map(x=>x.level)):'')+'</b></div>'}).join('')).join(''))}}else show('💎 Магазин','<div class="row"><div><b>💎 100 кристаллов</b><p>Донатный набор</p></div><button data-buy="donate">Скоро</button></div><div class="row"><div><b>💎 550 кристаллов</b><p>Донатный набор</p></div><button data-buy="donate">Скоро</button></div><div class="row"><div><b>👑 VIP-оформление</b><p>Косметический набор</p></div><button data-buy="donate">Скоро</button></div><div class="row"><div><b>🪙 300 монет</b><p>Обмен за кристаллы</p></div><button data-buy="exchange">💎 25</button></div><p class="note">Реальные платежи пока отключены. Перед продажами потребуется серверная проверка платежей и соответствие правилам VK.</p>');document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const t=b.dataset.buy;if(t==='donate'){alert('Платежи пока не подключены');return}if(t==='exchange'){if(d.gems<25){alert('Недостаточно кристаллов');return}d.gems-=25;d.coins+=300}else{const k=t==='power'?170*(d.power+1):130*(d.income+1);if(d.coins<k){alert('Недостаточно монет');return}d.coins-=k;d[t]++}save();hud();panel(tab)})}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.tab!=='game')panel(b.dataset.tab)});$('summon').onclick=recruit;$('start').onclick=begin;$('speed').onclick=()=>{battleSpeed=battleSpeed===1?2:1;hud()};$('repair').onclick=repair;function frame(t){const realDt=Math.min(.05,(t-last)/1000||0),dt=realDt*(busy&&!modal?battleSpeed:1);last=t;if(!busy)elapsed+=realDt;step(dt);draw();requestAnimationFrame(frame)}window.addEventListener('resize',resize);resize();hud();requestAnimationFrame(frame)})();
</script></body></html>
