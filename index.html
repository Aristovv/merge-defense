}

=>b.onclick=()=>{const g=goals.find(x=>x.id===b.dataset.ach);if(!g||g.current<g.goal||d.achievements.includes(g.id))return;d.achievements.push(g.id);d.coins+=g.coins;d.gems+=g.gems;save();hud();panel('collection');alert('Награда получена!')});$('open-collection').onclick=()=>{show('📚 Коллекция башен','<p class="note">Открыто '+d.discovered.length+' из 16 сочетаний. Доступные экземпляры: '+d.towers.length+'/12. Слияние требует одинаковую стихию, редкость и уровень.</p>'+[0,1,2,3].map(r=>'<h3 style="color:'+rarityColors[r]+'">'+rarityNames[r]+'</h3>'+names.map((name,t)=>{const owned=d.towers.filter(x=>x.type===t&&(x.rarity||0)===r);return '<div class="row"><div><b>'+signs[t]+' '+(d.discovered.includes(t+':'+r)?name:'???')+'</b><p>'+(d.discovered.includes(t+':'+r)?'Открыта · бонус урона ×'+rarityPower[r]:'Не найдена')+'</p></div><b>'+owned.length+' шт.'+(owned.length?' · ур. '+Math.max(...owned.map(x=>x.level)):'')+'</b></div>'}).join('')).join(''))}}else show('💎 Магазин','<div class="row"><div><b>💎 100 кристаллов</b><p>Донатный набор</p></div><button data-buy="vk-gems100">Тест · 5 голосов</button></div><div class="row"><div><b>💎 550 кристаллов</b><p>Донатный набор</p></div><button data-buy="vk-gems550">Тест · 20 голосов</button></div><div class="row"><div><b>👑 VIP-оформление</b><p>Косметический набор</p></div><button data-buy="donate">Скоро</button></div><div class="row"><div><b>🪙 300 монет</b><p>Обмен за кристаллы</p></div><button data-buy="exchange">💎 25</button></div><p class="note">Тестовые покупки отображаются отдельно и не расходуются в боях. Реальные платежи выключены до завершения синхронизации.</p><p class="note" id="payment-diagnostic" style="display:none;color:#ffd482;font-weight:700"></p><button id="check-purchase-balance" style="background:#57408a;border-radius:12px;padding:12px;width:100%;margin-top:8px">Проверить серверный баланс 💎</button><p class="note" id="remote-gems-status">Сервер: '+(remoteGems===null?'не проверен':remoteGems+' 💎')+'</p>');document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const t=b.dataset.buy;if(t==='donate'){alert('VIP пока недоступен');return}if(t.startsWith('vk-')){openVKPurchase(t.slice(3));return}if(t==='exchange'){if(d.gems<25){alert('Недостаточно кристаллов');return}d.gems-=25;d.coins+=300}else{const k=t==='power'?170*(d.power+1):130*(d.income+1);if(d.coins<k){alert('Недостаточно монет');return}d.coins-=k;d[t]++}save();hud();panel(tab)});const check=$('check-purchase-balance');if(check)check.onclick=refreshServerGems;}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.tab!=='game')panel(b.dataset.tab)});$('summon').onclick=recruit;$('surge').onclick=activateSurge;$('automerge').onclick=autoMerge;$('start').onclick=begin;$('speed').onclick=()=>{battleSpeed=battleSpeed===1?2:battleSpeed===2?3:1;d.battleSpeed=battleSpeed;save();hud()};$('repair').onclick=repair;function frame(t){const realDt=Math.min(.05,(t-last)/1000||0),dt=realDt*(busy&&!modal?battleSpeed:1);last=t;if(!busy)elapsed+=realDt;step(dt);draw();requestAnimationFrame(frame)}window.addEventListener('resize',resize);if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);if(window.ResizeObserver){new ResizeObserver(()=>{if(c.clientWidth&&c.clientHeight)resize()}).observe(c)}initVK();resize();hud();window.addEventListener('load',initVK,{once:true});requestAnimationFrame(frame)})();
