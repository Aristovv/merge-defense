 if(!Array.isArray(state.collect))state.collect=[];

 let newlyClaimed=0;

  existing.add(key);

 state.vip=Math.max(0,Math.floor(Number(state.vip)||0))+newlyClaimed;

function cc14Num(v){return Math.max(0,Math.min(1e12,Math.floor(Number(v)||0)))}
function cc14Data(){
 if(!state.liveCity14||typeof state.liveCity14!=='object')state.liveCity14={};
 const x=state.liveCity14;
 if(!Number.isFinite(x.nextChestAt))x.nextChestAt=Date.now();
 if(!Array.isArray(x.inventory))x.inventory=[];
 if(!x.boosts||typeof x.boosts!=='object')x.boosts={};
 if(!x.daily||x.daily.key!==today())x.daily={key:today(),games:[],rounds:0,builds:0,hot:0,claims:[]};
 if(!x.week||x.week.key!==casinoWeekKey())x.week={key:casinoWeekKey(),rounds:0,wins:0,claimed:false};
 if(!Array.isArray(x.history))x.history=[];
 return x;
}

}
function cc14Event(){

 return {key:day,event:CC14_EVENT_TYPES[dayNum%CC14_EVENT_TYPES.length]};
}
function cc14BoostActive(kind){

}
function cc14Time(ms){
 let seconds=Math.max(0,Math.ceil(ms/1000));

 return hours?hours+' ч '+minutes+' мин':minutes+' мин';
}
function cc14AddInventory(kind){
 const x=cc14Data();
 if(x.inventory.length>=25){state.chips+=80;return '80 фишек (инвентарь полон)'}

}
function cc14ChestReward(){
 const roll=rand(100),x=cc14Data();
 let label='',tier='',symbol='';
 if(roll<57){const amount=120+rand(181);state.chips+=amount;tier='ОБЫЧНЫЙ';symbol='◈';label='+'+fmt(amount)+' фишек'}
 else if(roll<82){const amount=150+rand(251);state.coins+=amount;tier='НЕОБЫЧНЫЙ';symbol='✦';label='+'+fmt(amount)+' монет'}
 else if(roll<96){const kind=rand(2)?'xp':'income';tier='РЕДКИЙ';symbol='◆';label=cc14AddInventory(kind)}
 else{tier='ЛЕГЕНДАРНЫЙ';symbol='♛';state.vip=cc14Num(state.vip)+1;label='+1 коллекционный VIP'}
 x.history.unshift({at:Date.now(),tier,symbol,label});
 x.history=x.history.slice(0,8);
 return {tier,symbol,label};
}
function cc14OpenChest(withKey=false){
 if(busy||round)return message('Заверши текущую игру');
 const x=cc14Data(),now=Date.now();
 if(withKey){

  if(i<0)return message('Нет ключа от сундука');
  x.inventory.splice(i,1);
 }else{
  if(now<x.nextChestAt)return message('Сундук ещё закрыт: '+cc14Time(x.nextChestAt-now));
  x.nextChestAt=Math.max(now,x.nextChestAt)+CC14_CHEST_WAIT;
 }
 x.daily.chests=(x.daily.chests||0)+1;
 const reward=cc14ChestReward();
 save();render();
 message('Сундук '+reward.tier+': '+reward.label);
}

 x.boosts[kind]=Math.max(Date.now(),Number(x.boosts[kind])||0)+CC14_BOOSTERS[kind].duration;
