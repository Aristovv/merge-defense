  rounds:Math.max(0,Number(previous.rounds)||0)+1,
  wins:Math.max(0,Number(previous.wins)||0)+(payout>0?1:0),
  spent:Math.max(0,Number(previous.spent)||0)+stake,

function casinoScratchTicket(){
 const roll=rand(100);
 let distribution=roll<3?[5,1,1,1,1]:roll<10?[4,2,1,1,1]:roll<25?[3,2,2,1,1]:[2,2,2,2,1];
 const ids=[0,1,2,3,4];
 for(let i=ids.length-1;i>0;i--){const j=rand(i+1);[ids[i],ids[j]]=[ids[j],ids[i]]}
 const cells=[];
 distribution.forEach((count,index)=>{for(let j=0;j<count;j++)cells.push(ids[index])});
 for(let i=cells.length-1;i>0;i--){const j=rand(i+1);[cells[i],cells[j]]=[cells[j],cells[i]]}
 return cells;
}
function casinoScratchPayout(cells){
 const counts=[0,0,0,0,0];
 cells.forEach(v=>{if(Number.isInteger(v)&&v>=0&&v<5)counts[v]++});
 const max=Math.max(...counts);
 return max>=5?roundBet*10:max===4?roundBet*5:max===3?roundBet*2:0;
}

}

 if(old&&old.key===key&&old.counts&&Array.isArray(old.claimed))return old;
 if(!state.questPeriods||typeof state.questPeriods!=='object')state.questPeriods={};
 state.questPeriods[scope]={key,counts:{plays:0,wins:0,builds:0},claimed:[]};

   if(!state.tournamentReceipts.includes(prize.receipt)){state.tournamentReceipts.push(prize.receipt);save()}
   render();message('Приз уже был получен ранее');return;

   save();
  }
  render();message('Турнирная награда получена!');
 }catch(e){message('Не удалось забрать приз: '+e.message)}
}
