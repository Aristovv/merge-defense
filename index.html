function renderBoard(){const el=$('board');el.innerHTML='';for(let i=0;i<15;i++){const t=d.board[i],node=document.createElement('div');node.className='cell'+(!t?' empty':'')+(selected===i?' selected':'')+(selected>=0&&t&&d.board[selected]&&i!==selected&&t.hero===d.board[selected].hero&&t.rank===d.board[selected].rank?' match':'');node.dataset.slot=i;if(t){const h=HEROES[t.hero];node.innerHTML='<div class="unit" style="--shine:'+h.color+'">'+heroArt(t.hero)+'<span class="rank">'+t.rank+'</span>'+(t.rank>=4?'<small>★</small>':'')+'</div>'}node.onclick=()=>clickCell(i);node.addEventListener('pointerdown',e=>{dragFrom=i;node.classList.add('dragging')});el.append(node)}}
let ignoreNextClick=false;document.addEventListener('pointerup',e=>{if(dragFrom<0)return;const from=dragFrom;dragFrom=-1;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('[data-slot]');if(target&&Number(target.dataset.slot)!==from){selected=from;clickCell(Number(target.dataset.slot));ignoreNextClick=true;setTimeout(()=>ignoreNextClick=false,0)}document.querySelectorAll('.cell.dragging').forEach(n=>n.classList.remove('dragging'))});function clickCell(i){if(ignoreNextClick)return;const t=d.board[i];if(selected<0){if(t){selected=i;toast('Выбери пустую клетку для перемещения или такую же башню для слияния')}else toast('Сначала выбери башню');renderBoard();return}

function begin(){if(running||modal)return;if(!d.board.some(Boolean)){toast('Призови хотя бы одного героя');return}running=true;spawned=0;spawnClock=0;waveTotal=8+d.wave*3;enemies=[];shots=[];toast(d.wave%5===0?'⚠️ Внимание: волна с боссом!':'⚔️ Волна началась');hud()}
function enemySpawn(){const boss=d.wave%5===0&&spawned===waveTotal-1;const kind=boss?'boss':spawned%6===0?'armored':spawned%4===0?'runner':'grunt';const hp=(30+d.wave*18)*(boss?8:kind==='armored'?1.6:1);enemies.push({id:++enemyId,t:0,hp,max:hp,boss,kind,elite:false,slow:0,poison:0,weak:0,speed:(kind==='runner'?.062:.045)*(boss?.55:1)*(1+d.wave*.025),phase:1});spawned++}
function hitEnemy(e,amount,hero){const h=HEROES[hero];let damage=amount*(e.kind==='armored'&&hero!==6?.72:1);if(hero===5&&e.hp<e.max*.5)damage*=1.65;if(hero===11&&e.boss)damage*=1.6;if(e.weak>0)damage*=1.2;e.hp-=damage;if(hero===1)e.slow=Math.max(e.slow,2.2);if(hero===3)e.poison=Math.max(e.poison,3.6);if(hero===10)e.weak=Math.max(e.weak,3);if(hero===2){let n=0;for(const o of enemies)if(o!==e&&Math.abs(o.t-e.t)<.12&&n++<2)o.hp-=damage*.32}if(hero===0){for(const o of enemies)if(o!==e&&Math.abs(o.t-e.t)<.07)o.hp-=damage*.3}}

shots.forEach(s=>s.life-=dt);shots=shots.filter(s=>s.life>0);

function spell(type){if(!running||spellCD[type]>0)return;const target=enemies.filter(e=>e.hp>0);if(!target.length){toast('Врагов пока нет');return}const cool={fire:14,freeze:17,shock:19};spellCD[type]=cool[type];for(const e of target){if(type==='fire')e.hp-=65+d.wave*9;else if(type==='freeze')e.slow=Math.max(e.slow,3.5);else e.hp-=43+d.wave*6}effects.push({x:W/2,y:H*.45,life:.5,radius:130,color:type==='fire'?'#ffab6b':type==='freeze'?'#8bdfff':'#e5bcff'});toast(type==='fire'?'🔥 Огненный шторм':type==='freeze'?'❄️ Массовая заморозка':'⚡ Цепная гроза')}
function hud(board=true){$('coins').textContent='🪙 '+d.coins;$('gems').textContent='💎 '+d.gems;$('hp').textContent='❤️ '+d.hp;$('mana').textContent='🔮 Мана '+d.mana;$('wave').textContent='Волна '+d.wave+'/10';$('foecount').textContent='⚔️ '+enemies.length+' врагов';$('progress').style.width=(running?Math.round(100*spawned/Math.max(1,waveTotal)):0)+'%';$('power').textContent='✨ Сила '+d.board.reduce((a,t)=>a+(t?Math.round(HEROES[t.hero].damage*(1+(t.rank-1)*.72)):0),0);$('summon').textContent='✨ Призвать · 🔮 '+(40+Math.floor(d.board.filter(Boolean).length/3)*20);$('summon').disabled=d.mana<40+Math.floor(d.board.filter(Boolean).length/3)*20||d.board.every(Boolean);$('start').textContent=running?'⚔️ Бой идёт':'▶ Начать волну';$('start').disabled=running;$('upgrade').textContent='⬆️ Сила '+(d.upgrade+1);$('upgrade').disabled=d.mana<65+d.upgrade*40||d.upgrade>=5;$('speed').textContent='⏩ ×'+speed;for(const k of Object.keys(spellCD))$(k).disabled=!running||spellCD[k]>0;const boss=enemies.find(e=>e.boss);$('bosswrap').classList.toggle('hide',!boss);if(boss){$('bosslabel').textContent='👹 БОСС · ФАЗА '+boss.phase+'/3';$('bosshp').style.width=clamp(boss.hp/boss.max*100,0,100)+'%'}if(board)renderBoard()}
function deckMenu(){if(running){toast('Колоду можно менять только между волнами');return}const body='<p>Выбери <b>ровно 5</b> разных персонажей. Именно они будут выпадать при призыве. Доступные карты отмечены цветом.</p><div class="cards">'+HEROES.map((h,i)=>'<button class="card '+(d.deck.includes(i)?'chosen':'')+'" data-hero="'+i+'" '+(!d.unlocked.includes(i)?'disabled':'')+'><span class="art">'+heroArt(i)+'</span><strong>'+h.name+'</strong><small>'+h.role+'</small><small>'+(d.deck.includes(i)?'✓ В колоде':d.unlocked.includes(i)?'Нажми, чтобы выбрать':'🔒 Закрыт')+'</small></button>').join('')+'</div><p class="tag">Карты можно открывать в коллекции за игровые монеты. Данные версии 6.6 не изменяются.</p>';open('🃏 Моя колода · '+d.deck.length+'/5',body);document.querySelectorAll('[data-hero]').forEach(b=>b.onclick=()=>{const id=+b.dataset.hero;if(d.deck.includes(id)){if(d.deck.length<=5){toast('Сначала выбери замену из доступных карт');return}}else{d.deck=[...d.deck.slice(1),id];save();deckMenu()}})}
