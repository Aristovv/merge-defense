<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta name="theme-color" content="#16112b"><title>MERGE DEFENSE</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d0a1b;color:#fff;font:15px system-ui,Arial;display:flex;justify-content:center}button{font:inherit;cursor:pointer;border:0;color:white}#app{width:min(100%,480px);min-height:100dvh;background:linear-gradient(#281b4c,#0d0b20);display:flex;flex-direction:column;overflow:hidden}.top{padding:12px 14px 8px;background:#17122b;box-shadow:0 4px 20px #05030c6b}.brand{font-size:20px;font-weight:1000;color:#f8d47b;text-shadow:0 2px 4px #6e3484}.stats{display:flex;gap:8px;justify-content:space-between;margin-top:8px}.pill{background:#392a59;border-radius:20px;padding:7px 10px;font-weight:800;font-size:13px}.field{position:relative;flex:1;min-height:355px;max-height:650px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#304957,#152b37 65%,#192039)}#board{width:100%;height:100%;touch-action:none}.progress{height:7px;background:#423550;border-radius:9px;overflow:hidden;margin-top:8px}.progress>div{height:100%;background:linear-gradient(90deg,#ffb94b,#f66d88);width:0}.controls{background:#1a1531;padding:12px 12px 6px}.actions{display:flex;gap:8px}.action{padding:12px 8px;flex:1;border-radius:13px;font-weight:900;background:linear-gradient(#a56eff,#6533cb);box-shadow:0 4px #42228a}.action.gold{background:linear-gradient(#ffe074,#efa629);color:#402515;box-shadow:0 4px #9e621c}.action:disabled{filter:grayscale(1);opacity:.55}.hint{text-align:center;color:#bfb0db;font-size:12px;margin:12px 0 6px}nav{display:flex;justify-content:space-around;background:#120e25;border-top:1px solid #503b72;padding:9px 3px max(11px,env(safe-area-inset-bottom))}nav button{background:transparent;color:#bfb0dd;font-size:12px;flex:1;padding:5px}nav button.active{color:#ffe079}.overlay{position:fixed;inset:0;background:#080512c9;display:flex;align-items:center;justify-content:center;padding:18px;z-index:4}.hidden{display:none!important}.sheet{background:linear-gradient(#332256,#1b1633);border:1px solid #8c62d6;border-radius:22px;width:min(100%,420px);padding:20px;max-height:80dvh;overflow:auto;box-shadow:0 25px 80px #0009}.sheet h2{margin:0 0 14px;color:#ffdb78}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #72549c70}.row p{margin:4px 0 0;color:#b8a7d5;font-size:12px}.row button,.close{padding:9px 13px;border-radius:10px;background:#6c42d5;font-weight:800}.close{margin-top:16px;width:100%}.note{font-size:12px;color:#c5b5dd;line-height:1.6}#toast{position:fixed;top:85px;left:50%;transform:translateX(-50%);z-index:9;background:#422e78;border:1px solid #ba89ff;border-radius:12px;padding:11px 18px;display:none;text-align:center;white-space:nowrap;font-weight:700}#toast.show{display:block}
</style></head><body><main id="app"><header class="top"><div class="brand">⚔ MERGE DEFENSE <small style="font-size:10px;color:#b6a4db">ALPHA 0.1</small></div><div class="stats"><span class="pill" id="coins"></span><span class="pill" id="gems"></span><span class="pill" id="hp"></span></div><div style="display:flex;justify-content:space-between;margin-top:9px"><b id="wave"></b><small id="kills"></small></div><div class="progress"><div id="bar"></div></div></header><section class="field"><canvas id="board"></canvas></section><div class="controls"><div class="actions"><button class="action gold" id="summon">Призвать</button><button class="action" id="start">▶ Начать волну</button></div><div class="hint">Нажми на башню, затем на такую же — чтобы объединить</div></div><nav><button class="active" data-tab="game">⚔️<div>Бой</div></button><button data-tab="upgrade">⬆️<div>Прокачка</div></button><button data-tab="collection">📚<div>Башни</div></button><button data-tab="shop">💎<div>Магазин</div></button></nav></main><div id="overlay" class="overlay hidden"><div class="sheet"><h2 id="heading"></h2><div id="content"></div><button id="close" class="close">Закрыть</button></div></div><div id="toast"></div><script>
(()=>{'use strict';const $=x=>document.getElementById(x),c=$('board'),ctx=c.getContext('2d');const colors=['#ff914a','#70dfff','#bc80ff','#a4fa6b'],signs=['🔥','❄️','⚡','☣️'],names=['Огненная','Ледяная','Грозовая','Ядовитая'];let d;try{d=JSON.parse(localStorage.getItem('md_game_01'))}catch{}d={coins:450,gems:60,hp:20,wave:1,kills:0,summons:0,power:0,income:0,towers:[],...d};if(!Array.isArray(d.towers))d.towers=[];let foes=[],shots=[],busy=false,spawn=0,clock=0,last=0,selection=-1,width=350,height=520,tile=75,gx=25,gy=270,seq=0,modal=false;const save=()=>{try{localStorage.setItem('md_game_01',JSON.stringify(d))}catch{}};const cost=()=>40+20*Math.floor(d.summons/3);const alert=t=>{const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(el.timer);el.timer=setTimeout(()=>el.classList.remove('show'),1700)};function hud(){$('coins').textContent='🪙 '+d.coins.toLocaleString('ru');$('gems').textContent='💎 '+d.gems;$('hp').textContent='❤️ '+d.hp;$('wave').textContent='Волна '+d.wave+'/10';$('kills').textContent='☠️ '+d.kills;$('summon').textContent='Призвать 🪙'+cost();$('summon').disabled=d.coins<cost()||d.towers.length>=12;$('start').disabled=busy;$('start').textContent=busy?'⚔️ Бой идёт':'▶ Начать волну';$('bar').style.width=(busy?Math.round(100*spawn/(7+d.wave*2)):0)+'%'}function pos(i){return {x:gx+(i%4+.5)*tile,y:gy+(Math.floor(i/4)+.5)*tile}}function find(i){return d.towers.findIndex(t=>t.slot===i)}function recruit(){if(busy){alert('Дождись окончания волны');return}if(d.coins<cost()||d.towers.length===12)return;const slots=Array.from({length:12},(_,i)=>i).filter(i=>find(i)<0),slot=slots[Math.floor(Math.random()*slots.length)];d.coins-=cost();d.summons++;d.towers.push({slot,level:1,type:Math.floor(Math.random()*4),cd:0});save();hud();alert('Башня призвана!')}function merge(i){if(busy){alert('Объединяй между волнами');return}if(find(i)<0){selection=-1;return}if(selection===-1){selection=i;alert('Выбери такую же башню');return}if(selection===i){selection=-1;return}const a=d.towers[find(selection)],b=d.towers[find(i)];if(a&&b&&a.type===b.type&&a.level===b.level){b.level++;d.towers.splice(find(selection),1);save();hud();alert('✨ Башня уровня '+b.level)}else alert('Нужны одинаковые тип и уровень');selection=-1}function point(p){let a=[[.10,.06],[.82,.13],[.76,.30],[.17,.38],[.18,.56],[.68,.63],[.68,Math.max(.68,gy/height-.025)]],f=Math.min(.999,p)*(a.length-1),i=Math.floor(f),r=f-i;return {x:(a[i][0]+(a[i+1][0]-a[i][0])*r)*width,y:(a[i][1]+(a[i+1][1]-a[i][1])*r)*height}}function begin(){if(!d.towers.length){alert('Сначала призови башню');return}if(busy)return;busy=true;spawn=0;clock=0;foes=[];shots=[];hud()}function show(title,body,button='Закрыть',callback){modal=true;$('heading').textContent=title;$('content').innerHTML=body;$('close').textContent=button;$('overlay').classList.remove('hidden');$('close').onclick=()=>{$('overlay').classList.add('hidden');modal=false;callback&&callback()}}function win(){busy=false;const w=d.wave,reward=75+w*28+d.income*18;d.coins+=reward;d.gems+=w%5===0?8:2;d.wave=w>=10?1:w+1;save();hud();show('🏆 Победа!','<p>Волна '+w+' пройдена.</p><p>Получено: 🪙 '+reward+' и 💎 '+(w%5===0?8:2)+'</p>','Продолжить')}function lose(){busy=false;d.hp=20;d.wave=1;d.coins+=50;foes=[];save();hud();show('💔 База захвачена','<p>Башни и улучшения сохранены. На восстановление выдано 50 монет.</p>','Продолжить')}function step(dt){if(!busy||modal)return;const count=7+d.wave*2;clock+=dt;if(spawn<count&&clock>Math.max(.36,1.1-d.wave*.045)){clock=0;let boss=d.wave%5===0&&spawn===count-1,hp=(25+d.wave*15)*(boss?8:1);foes.push({id:++seq,p:0,hp,max:hp,speed:(.03+d.wave*.0012)*(boss?.55:1),boss,slow:0});spawn++}for(const f of foes){f.p+=dt*f.speed*(f.slow>0?.55:1);f.slow=Math.max(0,f.slow-dt)}for(let i=foes.length-1;i>=0;i--)if(foes[i].p>=1){foes.splice(i,1);d.hp--;if(d.hp<=0){lose();return}}for(const t of d.towers){t.cd-=dt;if(t.cd<=0){const p=pos(t.slot);let best,dist=Infinity;for(const f of foes){const q=point(f.p),r=Math.hypot(q.x-p.x,q.y-p.y);if(r<tile*6&&r<dist){best=f;dist=r}}if(best){t.cd=Math.max(.18,.9-t.level*.06);shots.push({x:p.x,y:p.y,id:best.id,type:t.type,dmg:(7+4*(t.level-1))*1.7**(t.level-1)*(1+d.power*.13)})}}}for(let i=shots.length-1;i>=0;i--){const s=shots[i],f=foes.find(x=>x.id===s.id);if(!f){shots.splice(i,1);continue}const p=point(f.p),dx=p.x-s.x,dy=p.y-s.y,dist=Math.hypot(dx,dy);if(dist<16){f.hp-=s.dmg;if(s.type===1)f.slow=1.3;shots.splice(i,1);if(f.hp<=0){foes.splice(foes.indexOf(f),1);d.kills++;d.coins+=5+d.income*2}continue}s.x+=dx/dist*Math.min(dist,500*dt);s.y+=dy/dist*Math.min(dist,500*dt)}if(spawn===count&&!foes.length)win();hud()}function rect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function draw(){ctx.clearRect(0,0,width,height);const g=ctx.createLinearGradient(0,0,0,height);g.addColorStop(0,'#213d45');g.addColorStop(1,'#15172f');ctx.fillStyle=g;ctx.fillRect(0,0,width,height);for(let i=0;i<30;i++){ctx.fillStyle=i%2?'#345b4d':'#426756';ctx.beginPath();ctx.arc((i*77+17)%width,(i*101+45)%Math.max(100,gy-20),7+i%12,0,7);ctx.fill()}ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();for(let i=0;i<=70;i++){const p=point(i/70);i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)}ctx.strokeStyle='#161b26';ctx.lineWidth=width*.115;ctx.stroke();ctx.strokeStyle='#77717b';ctx.lineWidth=width*.08;ctx.stroke();rect(0,gy-8,width,height-gy+8,10,'#11162c');for(let i=0;i<12;i++){const p=pos(i),s=tile*.89;rect(p.x-s/2,p.y-s/2,s,s,9,selection===i?'#8868e5':'#34334f');rect(p.x-s*.44,p.y-s*.44,s*.88,s*.88,7,'#484766')}for(const t of d.towers){const p=pos(t.slot);ctx.shadowColor=colors[t.type];ctx.shadowBlur=17;ctx.fillStyle=colors[t.type];ctx.beginPath();ctx.arc(p.x,p.y,tile*.28,0,7);ctx.fill();ctx.shadowBlur=0;ctx.font=Math.round(tile*.34)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(signs[t.type],p.x,p.y);rect(p.x+tile*.09,p.y+tile*.10,22,19,7,'#131025');ctx.font='bold 12px system-ui';ctx.fillStyle='white';ctx.fillText(t.level,p.x+tile*.23,p.y+tile*.22)}for(const f of foes){const p=point(f.p),r=f.boss?22:13;ctx.fillStyle=f.boss?'#b85569':'#bbaa48';ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();ctx.font=(f.boss?25:17)+'px system-ui';ctx.fillText(f.boss?'👹':'👾',p.x,p.y);rect(p.x-r,p.y-r-10,r*2,4,2,'#572b43');rect(p.x-r,p.y-r-10,r*2*Math.max(0,f.hp/f.max),4,2,'#83ef70')}for(const s of shots){ctx.fillStyle=colors[s.type];ctx.shadowColor=colors[s.type];ctx.shadowBlur=12;ctx.beginPath();ctx.arc(s.x,s.y,5,0,7);ctx.fill();ctx.shadowBlur=0}if(!busy){rect(width*.18,65,width*.64,37,10,'#30215bd9');ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 13px system-ui';ctx.fillText('⚔️ ГОТОВ К СРАЖЕНИЮ',width/2,84)}}function resize(){const b=c.getBoundingClientRect(),scale=Math.min(2,window.devicePixelRatio||1);width=b.width;height=b.height;c.width=Math.round(width*scale);c.height=Math.round(height*scale);ctx.setTransform(scale,0,0,scale,0,0);tile=Math.min(width*.235,height*.115,76);gx=(width-tile*4)/2;gy=height-tile*3-17}c.addEventListener('pointerdown',e=>{const b=c.getBoundingClientRect(),i=Math.floor((e.clientX-b.left-gx)/tile),j=Math.floor((e.clientY-b.top-gy)/tile);if(i>=0&&i<4&&j>=0&&j<3)merge(j*4+i)});function panel(tab){if(tab==='upgrade'){let a=170*(d.power+1),b=130*(d.income+1);show('⬆️ Прокачка','<div class="row"><div><b>⚔️ Мощь башен · '+d.power+'</b><p>+13% урона за уровень</p></div><button data-buy="power">🪙 '+a+'</button></div><div class="row"><div><b>🪙 Добыча · '+d.income+'</b><p>Больше монет за врагов</p></div><button data-buy="income">🪙 '+b+'</button></div>')}else if(tab==='collection')show('📚 Коллекция',names.map((n,i)=>'<div class="row"><div><b>'+signs[i]+' '+n+'</b><p>Объединяй одинаковые башни</p></div></div>').join(''));else show('💎 Магазин','<div class="row"><div><b>💎 100 кристаллов</b><p>Донатный набор</p></div><button data-buy="donate">Скоро</button></div><div class="row"><div><b>💎 550 кристаллов</b><p>Донатный набор</p></div><button data-buy="donate">Скоро</button></div><div class="row"><div><b>👑 VIP-оформление</b><p>Косметический набор</p></div><button data-buy="donate">Скоро</button></div><div class="row"><div><b>🪙 300 монет</b><p>Обмен за кристаллы</p></div><button data-buy="exchange">💎 25</button></div><p class="note">Реальные платежи пока отключены. Перед продажами потребуется серверная проверка платежей и соответствие правилам VK.</p>');document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const t=b.dataset.buy;if(t==='donate'){alert('Платежи пока не подключены');return}if(t==='exchange'){if(d.gems<25){alert('Недостаточно кристаллов');return}d.gems-=25;d.coins+=300}else{const k=t==='power'?170*(d.power+1):130*(d.income+1);if(d.coins<k){alert('Недостаточно монет');return}d.coins-=k;d[t]++}save();hud();panel(tab)})}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.tab!=='game')panel(b.dataset.tab)});$('summon').onclick=recruit;$('start').onclick=begin;function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;step(dt);draw();requestAnimationFrame(frame)}window.addEventListener('resize',resize);resize();hud();requestAnimationFrame(frame)})();
</script></body></html>
