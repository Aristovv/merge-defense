);d.hp--;if(d.hp<=0){lose();return}}for(const t of d.towers){t.cd-=dt;if(t.cd<=0){const p=pos(t.slot);let best,dist=Infinity;for(const f of foes){const q=point(f.p),r=Math.hypot(q.x-p.x,q.y-p.y);if(r<tile*6&&r<dist){best=f;dist=r}}if(best){t.cd=Math.max(.18,.9-t.level*.06);shots.push({x:p.x,y:p.y,id:best.id,type:t.type,dmg:(7+4*(t.level-1))*1.7**(t.level-1)*(1+d.power*.13)})}}}for(let i=shots.length-1;i>=0;i--){const s=shots[i],f=foes.find(x=>x.id===s.id);if(!f){shots.splice(i,1);continue}const p=point(f.p),dx=p.x-s.x,dy=p.y-s.y,dist=Math.hypot(dx,dy);if(dist<16){f.hp-=s.dmg*(f.kind==='armored'?.7:1);sparks.push({x:p.x,y:p.y,t:.24});if(s.type===1)f.slow=1.3;shots.splice(i,1);if(f.hp<=0){foes.splice(foes.indexOf(f),1);d.kills++;d.coins+=5+d.income*2}continue}s.x+=dx/dist*Math.min(dist,500*dt);s.y+=dy/dist*Math.min(dist,500*dt)}if(spawn===count&&!foes.length)win();sparks=sparks.filter(p=>(p.t-=dt)>0);hud()}function rect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function draw(){ctx.clearRect(0,0,width,height);
const g=ctx.createLinearGradient(0,0,0,height);g.addColorStop(0,'#163744');g.addColorStop(.55,'#203e4a');g.addColorStop(1,'#17162c');ctx.fillStyle=g;ctx.fillRect(0,0,width,height);

for(let i=0;i<12;i++){const p=pos(i),z=tile*.9;rect(p.x-z/2+1,p.y-z/2+5,z,z,12,'#0e1024');rect(p.x-z/2,p.y-z/2,z,z,12,selection===i?'#7d55ce':'#36374d');rect(p.x-z*.45,p.y-z*.45,z*.9,z*.9,10,'#43445c')}
for(const t of d.towers){const p=pos(t.slot),r=tile*.28,co=colors[t.type];ctx.shadowColor=co;ctx.shadowBlur=13;rect(p.x-r*.8,p.y+r*.55,r*1.6,r*.43,4,'#0b0d21');ctx.shadowBlur=0;
ctx.fillStyle='#737386';ctx.beginPath();ctx.moveTo(p.x-r,p.y+r*.35);ctx.lineTo(p.x-r*.8,p.y-r*.65);ctx.lineTo(p.x+r*.8,p.y-r*.65);ctx.lineTo(p.x+r,p.y+r*.35);ctx.closePath();ctx.fill();ctx.strokeStyle='#b3b1c8';ctx.lineWidth=1.5;ctx.stroke();rect(p.x-r*.64,p.y-r*.83,r*1.28,r*.36,4,'#26253f');
ctx.shadowColor=co;ctx.shadowBlur=17;ctx.fillStyle=co;ctx.beginPath();for(let k=0;k<6;k++){const a=k*Math.PI/3-Math.PI/2;ctx.lineTo(p.x+Math.cos(a)*r*.6,p.y-r*.48+Math.sin(a)*r*.6)}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffffffa8';ctx.stroke();rect(p.x+r*.35,p.y+r*.17,22,19,7,'#11132b');ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 12px system-ui';ctx.fillStyle='#fff';ctx.fillText(t.level,p.x+r*.35+11,p.y+r*.17+10)}
for(const f of foes){const p=point(f.p),r=f.boss?22:f.kind==='armored'?16:13;ctx.save();ctx.translate(p.x,p.y);ctx.shadowColor=f.boss?'#fa4b69':'#0009';ctx.shadowBlur=10;ctx.fillStyle=f.boss?'#a34460':f.kind==='armored'?'#6c7a93':f.kind==='runner'?'#b7b048':'#7aaf67';ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r,-r*.25);ctx.lineTo(r*.7,r*.75);ctx.lineTo(-r*.7,r*.75);ctx.lineTo(-r,-r*.25);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#f44f62';ctx.beginPath();ctx.arc(-r*.34,-r*.12,2.6,0,7);ctx.arc(r*.34,-r*.12,2.6,0,7);ctx.fill();ctx.strokeStyle='#2b2132';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-r*.4,r*.4);ctx.lineTo(r*.4,r*.4);ctx.stroke();ctx.restore();rect(p.x-r,p.y-r-12,r*2,5,2,'#4c2640');rect(p.x-r,p.y-r-12,r*2*Math.max(0,f.hp/f.max),5,2,f.hp/f.max>.4?'#8bea7d':'#f6a55a')}
