function battlePaint(){
 if(!combat)return;
 var u=$('our-hp'),e=$('their-hp'),uf=$('our-fill'),ef=$('their-fill');
 if(!u||!e||!uf||!ef)return;
 u.textContent=Math.max(0,Math.ceil(combat.castle))+' / '+Math.ceil(combat.maxCastle);
 e.textContent=Math.max(0,Math.ceil(combat.hp))+' / '+Math.ceil(combat.maxHp);
 uf.style.width=Math.max(0,100*combat.castle/combat.maxCastle)+'%';

 var mana=$('battle-mana');if(mana)mana.textContent='Заряды магии: '+combat.spell;
}
function battleTick(){
 if(!combat)return;
 combat.seconds+=.2;
 combat.hp-=combat.damage*.2;
 combat.castle-=combat.enemyDamage*(combat.slow>0?.3:1)*.2;

 var status=$('battle-status');
 if(status)status.textContent=combat.slow>0?'❄️ Вражеские силы заморожены':'⚔️ Герои сражаются с '+combat.enemyName;
 battlePaint();
 if(combat.hp<=0||combat.castle<=0||combat.seconds>=90){
  var win=combat.hp<=0&&combat.castle>0;
  var boss=combat.boss;
  clearInterval(combatTimer);combatTimer=null;combat=null;
  if(win){s.wins++;if(boss){s.bosses++;s.crystal+=12;s.gold+=240;xp(70)}else{s.defenses++;s.gold+=120+s.castle*55;s.wood+=45;s.stone+=35;xp(45)}}
  else{if(!boss){s.defenses++;var loss=Math.min(s.gold,Math.round(45+s.castle*10));s.gold-=loss}xp(12)}
  persist();
  var title=win?'🏆 ПОБЕДА!':'💔 ПОРАЖЕНИЕ';
  showModal(title,win?(boss?'Дракон повержен! Получено 12 кристаллов, 240 золота и опыт.':'Королевство устояло! Получены золото, дерево, камень и опыт.'):'Враги оказались сильнее. Улучши башни и героев, а затем попробуй снова.','<button class="act green" data-action="battleResult" style="width:100%;padding:13px">Вернуться в королевство</button>');
 }
}
function magic(which){

}

function upgrade(tile){var b=building(tile);if(!b)return;if(b.level>=20){notify('Достигнут максимальный уровень');return}var cost=upgradePrice(b);if(!pay(cost))return;b.level++;if(b.type===0)s.castle=b.level;xp(20+b.level*10);persist();clearModal();render();notify(types[b.type].n+' улучшено до уровня '+b.level)}
function researchModal(){if(!contains(11)){notify('Сначала построй Академию');return}showModal('📜 Древо исследований','Каждую технологию можно изучить один раз.','<div class="list">'+researches.map(function(r,i){var cost=[180+i*110,90+i*55,90+i*65,4+i*3,0];return '<div class="item"><div class="pic">🔬</div><div class="details"><b>'+r[0]+'</b><small>'+r[1]+'</small><small>'+costText(cost)+'</small></div><button class="act" data-action="study" data-id="'+i+'" '+(s.research.includes(i)||!affordable(cost)?'disabled':'')+'>'+(s.research.includes(i)?'Изучено':'Изучить')+'</button></div>'}).join('')+'</div>')}
function action(el){var a=el.dataset.action,id=Number(el.dataset.id),tile=Number(el.dataset.tile);if(a==='close'){clearModal();return}if(a==='tile'){tileClick(tile);return}if(a==='castle'){var b=building(12);if(b)showModal('🏰 Королевский замок','Главная постройка открывает новые области и магические здания.',buildInfo(b));return}if(a==='build'){if(building(tile)||!unlocked(tile))return;var typ=types[id];if(!typ||id===0)return;if(!pay(typ.cost))return;s.buildings.push({tile:tile,type:id,level:1});xp(18);persist();clearModal();render();notify('Построено: '+typ.n);return}if(a==='upgrade'){upgrade(tile);return}if(a==='unlock'){var cost=[450+id*300,220+id*130,180+id*120,0];if(s.zones.includes(id)||s.castle<id+1||!pay(cost))return;s.zones.push(id);xp(60);persist();clearModal();render();notify('Открыта новая территория!');return}if(a==='collect'){production();persist();render();notify('Доход зданий начислен автоматически');return}if(a==='research'){researchModal();return}if(a==='study'){var cost=[180+id*110,90+id*55,90+id*65,4+id*3,0];if(!contains(11)||s.research.includes(id)||!pay(cost))return;s.research.push(id);xp(35);persist();clearModal();render();notify('Исследование завершено');return}
if(a==='hire'){var cost=[0,0,0,25+id*5,0];if(ownedHero(id)||!pay(cost))return;s.heroes.push({id:id,level:1,star:1});if(s.squad.length<5)s.squad.push(id);xp(40);persist();render();notify('Герой вступил в королевство!');return}
if(a==='heroUp'){var h=ownedHero(id);if(!h||h.level>=100)return;var cost=price([90,25,25,0],h.level);if(!pay(cost))return;h.level++;if(h.level%10===0&&h.star<5)h.star++;xp(10);persist();render();notify('Герой улучшен до '+h.level+' уровня');return}
if(a==='squad'){if(!ownedHero(id))return;var p=s.squad.indexOf(id);if(p>=0){if(s.squad.length<=1){notify('В отряде нужен хотя бы один герой');return}s.squad.splice(p,1)}else{if(s.squad.length>=5){notify('В отряде максимум 5 героев');return}s.squad.push(id)}persist();render();return}
if(a==='journey'){complete();var j=journeys[id];if(!j||s.expeditions.length>=2||!s.squad.length||power()<j.power*.6||s.food<j.food)return;s.food-=j.food;s.expeditions.push({id:id,ends:now()+j.duration,power:Math.round(power())});persist();render();notify('Отряд отправлен в поход!');return}
if(a==='defend'){battleStart(false);return}
if(a==='boss'){battleStart(true);return}
if(a==='magic'){magic(id);return}
if(a==='battleResult'){clearModal();render();return}
if(a==='daily'){if(s.lastDaily===s.dayStamp)return;s.lastDaily=s.dayStamp;s.gold+=180;s.wood+=80;s.crystal+=3;persist();render();notify('Ежедневная награда получена!');return}
if(a==='claim'){var q=questList.find(function(q){return q[0]===el.dataset.id});if(!q||!q[3]()||s.claimed.includes(q[0]))return;q[4].forEach(function(v,i){s[resource[i]]+=v});s.claimed.push(q[0]);xp(35);persist();render();notify('Награда за задание получена!');return}
if(a==='trade'){var prices=[150,140,100,280],gains=[[1,100],[2,100],[4,90],[3,3]];if(s.gold<prices[id])return;s.gold-=prices[id];s[resource[gains[id][0]]]+=gains[id][1];persist();render();notify('Обмен выполнен');return}
}
document.addEventListener('click',function(e){var el=e.target.closest('[data-action],[data-tab]');if(!el)return;if(el.dataset.tab){clearModal();transition(el.dataset.tab)}else action(el)});
$('modal').addEventListener('click',function(e){if(e.target===$('modal'))clearModal()});
var launch=location.search.replace(/^\?/,'');cloudEnabled=!!(new URLSearchParams(launch).get('vk_user_id')&&new URLSearchParams(launch).get('vk_app_id'));
function headers(){return {'Content-Type':'application/json','X-VK-Launch-Params':launch}}
function snapshot(){return {gameVersion:120,state:s}}
async function cloudInit(){if(!cloudEnabled)return;try{cloudBusy=true;var response=await fetch('/api/kingdom/save',{headers:headers(),cache:'no-store'});if(!response.ok)throw Error('Cloud '+response.status);var data=await response.json();cloudRev=data.revision||0;if(data.save&&data.save.gameVersion===120&&data.save.state){var remote=data.save.state; if(remote.updated>=s.updated||!localStorage.getItem(K)){s=Object.assign(fresh(),remote);try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}}else dirty=true}else dirty=true;cloudReady=true;cloudBusy=false;production();daily();complete();render();if(dirty)saveTimer=setTimeout(upload,750);notify('☁️ Облако королевства подключено')}catch(e){cloudBusy=false;notify('💾 Локальное сохранение активно');console.warn('Kingdom cloud not ready',e)}}
async function upload(){if(!cloudReady||!dirty||saving)return;saving=true;var sent=JSON.stringify(snapshot());try{var response=await fetch('/api/kingdom/save',{method:'PUT',headers:headers(),body:JSON.stringify({revision:cloudRev,save:JSON.parse(sent)})});if(response.status===409){cloudReady=false;setTimeout(cloudInit,1300);return}if(!response.ok)throw Error('Save '+response.status);var data=await response.json();cloudRev=data.revision;dirty=JSON.stringify(snapshot())!==sent}catch(e){console.warn('Kingdom save pending',e);dirty=true}finally{saving=false;if(dirty&&cloudReady)saveTimer=setTimeout(upload,4500)}}
production();daily();complete();render();cloudInit();
setInterval(function(){production();complete();if(tab==='city'||tab==='journeys')render();if(now()-lastSave>30000)persist()},15000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){production();complete();daily();render()}else{persist()}});
})();
</script></body></html>
