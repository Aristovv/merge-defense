function step(dt){time+=dt;for(const k of Object.keys(spellCD))spellCD[k]=Math.max(0,spellCD[k]-dt);for(const e of effects)e.life-=dt;effects=effects.filter(x=>x.life>0);if(!running)return;
spawnClock+=dt;if(spawned<waveTotal&&spawnClock>.8){spawnClock=0;enemySpawn()}
for(const e of enemies){e.t+=dt*e.speed*(e.slow>0?.5:1);e.slow=Math.max(0,e.slow-dt);e.poison=Math.max(0,e.poison-dt);e.weak=Math.max(0,e.weak-dt);if(e.poison>0)e.hp-=dt*(6+d.wave*1.3);if(e.boss){const phase=e.hp/e.max<.33?3:e.hp/e.max<.67?2:1;if(phase>e.phase){e.phase=phase;e.speed*=1.14;effects.push({x:pos(e.t).x,y:pos(e.t).y,life:.5,radius:95,color:'#ff9eaa'});toast('👹 Босс перешёл в фазу '+phase)}}}
for(let i=0;i<15;i++){const t=d.board[i];if(!t)continue;cooldown[i]-=dt;if(cooldown[i]>0)continue;const targets=enemies.filter(e=>e.t<1&&e.hp>0);if(!targets.length)continue;targets.sort((a,b)=>b.t-a.t);const target=targets[0],h=HEROES[t.hero];let boost=1+d.upgrade*.17;const rank=1+(t.rank-1)*.72;let rate=h.rate;const x=i%5,y=Math.floor(i/5);for(let j=0;j<15;j++){const o=d.board[j];if(!o||j===i)continue;if(Math.abs(j%5-x)+Math.abs(Math.floor(j/5)-y)!==1)continue;if(o.hero===9)rate*=.92;if(o.hero===7)boost*=1.04}cooldown[i]=Math.max(.18,rate/rank);const damage=h.damage*boost*rank;hitEnemy(target,damage,t.hero);const p=pos(target.t);const fromX=W*(.13+(i%5)*.185),fromY=H*.91;shots.push({x:fromX,y:fromY,tx:p.x,ty:p.y,color:h.color,life:.22,max:.22})}
shots.forEach(s=>s.life-=dt);shots=shots.filter(s=>s.life>0);
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(e.hp<=0){enemies.splice(i,1);d.kills++;d.mana+=e.boss?130:11+d.wave*2;d.coins+=e.boss?100:4;const p=pos(e.t);effects.push({x:p.x,y:p.y,life:.5,radius:e.boss?60:22,color:e.boss?'#ffc478':'#b1ffd1'})}else if(e.t>=1){enemies.splice(i,1);d.hp-=e.boss?5:1;if(d.hp<=0){d.hp=20;running=false;d.wave=1;d.upgrade=0;save();hud();open('💔 Оборона прорвана','<p>Монстры прорвались к замку. Начинается новый поход, но твоя коллекция, колода и собранные башни сохраняются.</p><p>Попробуй другую расстановку героев или усили их за ману.</p>');return}}}
if(spawned>=waveTotal&&enemies.length===0){running=false;const completed=d.wave;d.wins++;d.gems+=completed%5===0?15:3;d.coins+=75+completed*12;d.wave=completed===10?1:completed+1;d.highest=Math.max(d.highest,completed);d.upgrade=0;d.mana+=100;save();hud();open('🏆 Волна '+completed+' пройдена!','<p>Твои герои удержали оборону. Следующая волна: <b>'+d.wave+'/10</b>.</p><div class="stat"><span>🪙 Награда</span><b>+'+(75+completed*12)+'</b></div><div class="stat"><span>💎 Кристаллы</span><b>+'+(completed%5===0?15:3)+'</b></div><div class="stat"><span>🔮 Мана для призыва</span><b>+100</b></div><p>Объединяй героев и улучшай колоду перед следующей волной.</p>');return}
hud(false)}
function spell(type){if(!running||spellCD[type]>0)return;const target=enemies.filter(e=>e.hp>0);if(!target.length){toast('Врагов пока нет');return}const cool={fire:14,freeze:17,shock:19};spellCD[type]=cool[type];for(const e of target){if(type==='fire')e.hp-=65+d.wave*9;else if(type==='freeze')e.slow=Math.max(e.slow,3.5);else e.hp-=43+d.wave*6}effects.push({x:W/2,y:H*.45,life:.5,radius:130,color:type==='fire'?'#ffab6b':type==='freeze'?'#8bdfff':'#e5bcff'});toast(type==='fire'?'🔥 Огненный шторм':type==='freeze'?'❄️ Массовая заморозка':'⚡ Цепная гроза')}
function hud(board=true){$('coins').innerHTML=uiIcon('coin')+' '+d.coins;$('gems').innerHTML=uiIcon('gem')+' '+d.gems;$('hp').innerHTML=uiIcon('heart')+' '+d.hp;$('mana').innerHTML=uiIcon('mana')+' Мана '+d.mana;$('wave').textContent='Волна '+d.wave+'/10';$('foecount').innerHTML=uiIcon('sword')+' '+enemies.length+' врагов';$('progress').style.width=(running?Math.round(100*spawned/Math.max(1,waveTotal)):0)+'%';$('power').innerHTML=uiIcon('spark')+' Сила '+d.board.reduce((a,t)=>a+(t?Math.round(HEROES[t.hero].damage*(1+(t.rank-1)*.72)):0),0);$('summon').innerHTML=uiIcon('spark')+' Призвать · '+uiIcon('mana')+' '+(40+Math.floor(d.board.filter(Boolean).length/3)*20);$('summon').disabled=d.mana<40+Math.floor(d.board.filter(Boolean).length/3)*20||d.board.every(Boolean);$('start').innerHTML=running?uiIcon('sword')+' Бой идёт':uiIcon('play')+' Начать волну';$('start').disabled=running;$('upgrade').innerHTML=uiIcon('up')+' Сила '+(d.upgrade+1);$('upgrade').disabled=d.mana<65+d.upgrade*40||d.upgrade>=5;$('speed').innerHTML=uiIcon('fast')+' ×'+speed;for(const k of Object.keys(spellCD))$(k).disabled=!running||spellCD[k]>0;const boss=enemies.find(e=>e.boss);$('bosswrap').classList.toggle('hide',!boss);if(boss){$('bosslabel').innerHTML=uiIcon('skull')+' БОСС · ФАЗА '+boss.phase+'/3';$('bosshp').style.width=clamp(boss.hp/boss.max*100,0,100)+'%'}if(board)renderBoard()}
function deckMenu(){if(running){toast('Колоду можно менять только между волнами');return}const body='<p>Выбери <b>ровно 5</b> разных персонажей. Именно они будут выпадать при призыве. Доступные карты отмечены цветом.</p><div class="cards">'+HEROES.map((h,i)=>'<button class="card '+(d.deck.includes(i)?'chosen':'')+'" data-hero="'+i+'" '+(!d.unlocked.includes(i)?'disabled':'')+'><span class="art">'+heroArt(i)+'</span><strong>'+h.name+'</strong><small>'+h.role+'</small><small>'+(d.deck.includes(i)?'✓ В колоде':d.unlocked.includes(i)?'Нажми, чтобы выбрать':'🔒 Закрыт')+'</small></button>').join('')+'</div><p class="tag">Карты можно открывать в коллекции за игровые монеты. Данные версии 6.6 не изменяются.</p>';open('🃏 Моя колода · '+d.deck.length+'/5',body);document.querySelectorAll('[data-hero]').forEach(b=>b.onclick=()=>{const id=+b.dataset.hero;if(d.deck.includes(id)){if(d.deck.length<=5){toast('Сначала выбери замену из доступных карт');return}}else{d.deck=[...d.deck.slice(1),id];save();deckMenu()}})}
function collection(){const body='<p>У каждого героя своя атака и роль. Открывай новых героев за монеты, собирай разные колоды.</p><div class="cards">'+HEROES.map((h,i)=>'<div class="card"><span class="art">'+heroArt(i)+'</span><strong>'+h.name+'</strong><small>'+h.trait+'</small><small>'+(d.unlocked.includes(i)?'✓ Открыт':'🔒 Цена: '+(450+i*80)+' 🪙')+'</small>'+(!d.unlocked.includes(i)?'<button class="btn" data-unlock="'+i+'">Открыть</button>':'')+'</div>').join('')+'</div>';open('📚 Коллекция героев',body);document.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=()=>{const id=+b.dataset.unlock,price=450+id*80;if(d.coins<price){toast('Недостаточно монет');return}d.coins-=price;d.unlocked.push(id);save();hud();collection()})}
$('tabdeck').onclick=deckMenu;$('tabcollection').onclick=collection;$('tabbattle').onclick=()=>{close();toast('⚔️ Перетащи одинаковых героев друг на друга')};$('summon').onclick=summon;$('start').onclick=begin;$('speed').onclick=()=>{speed=speed===1?2:speed===2?3:1;hud()};$('upgrade').onclick=()=>{const cost=65+d.upgrade*40;if(d.mana<cost||d.upgrade>=5)return;d.mana-=cost;d.upgrade++;save();hud();toast('⬆️ Урон всех героев усилен')};for(const k of ['fire','freeze','shock'])$(k).onclick=()=>spell(k);
function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if($('shade').classList.contains('hide'))step(dt*speed);draw();requestAnimationFrame(frame)}
resize();hud();requestAnimationFrame(frame);toast('🃏 Собери колоду из 5 героев — затем призывай и объединяй');
})();
</script></body></html>
