news:`<div class="tag">📰 НОВОСТИ И СОБЫТИЯ</div><h2>Новости Lucky City</h2><p>Добро пожаловать в официальный информационный раздел Lucky City! Здесь мы рассказываем об устройстве игрового города, игровых режимах, коллекциях, соревнованиях, обновлениях и полезных возможностях для игроков. Раздел помогает разобраться, чем заняться сегодня и где следить за развитием проекта.</p><h3>🎰 Игровой город: выбирайте свой режим</h3><p>В Lucky City собраны разные игровые развлечения на виртуальные Lucky Coins (LC). Любителям динамики подойдёт Crash, тем, кто предпочитает выбирать клетки и оценивать риск, — Mines. В Plinko можно наблюдать за движением шариков и результатами их попадания в ячейки с множителями. Колесо наград даёт отдельный повод заглянуть в игру.</p><p>У каждого режима собственная механика. Перед участием проверяйте ставку, доступный баланс, число шариков или другие параметры. Результаты раундов не гарантированы, а виртуальные награды зависят от правил конкретного режима.</p><h3>🏆 Задания, достижения и соревнование</h3><p>Помимо игровых раундов, в Lucky City можно исследовать задания и достижения, следить за своим прогрессом и сравнивать результаты с другими участниками в рейтингах. Если в текущей версии доступны клубы, можно участвовать и в клубной активности. Условия конкретного задания и награды смотрите в самой игре: они могут различаться и меняться с обновлениями.</p><h3>✨ Оформления и развитие профиля</h3><p>Персонализируйте игровой опыт с помощью доступных оформлений и косметических элементов. В игре могут появляться новые темы, эффекты и варианты внешнего вида. Способ получения каждого оформления — за достижения, игровую активность или отдельное предложение — указывается непосредственно в соответствующем разделе.</p><h3>📣 Где читать объявления об обновлениях</h3><p>Анонсы, сообщения о технических работах, новые события и важные изменения публикуются в <a href="https://vk.ru/lucky_city_app">сообществе Lucky City во ВКонтакте</a>. Также открыта <a href="https://vk.ru/@lucky_city_app-novosti-lucky-city">постоянная статья «Новости Lucky City»</a>. Проверяйте дату публикации: описание будущего обновления не означает, что оно уже установлено у всех игроков.</p><h3>🛠️ Если что-то работает неправильно</h3><p>Если режим не запускается, анимация выглядит некорректно, награда не отображается или покупка не начислена, сообщите в поддержку. Укажите режим, примерное время события и приложите скриншот, если он есть. Это помогает быстрее найти причину ошибки.</p><p class="note">Lucky City — развлекательная игра для пользователей 18+. LC — внутриигровые единицы: они не являются деньгами, не обмениваются на реальные средства и не предполагают денежного выигрыша. Информация о режимах и возможностях носит справочный характер; фактический состав игры определяется установленной версией.</p>`,
rules:`<div class="tag">🎮 ПОДРОБНОЕ РУКОВОДСТВО</div><h2>Правила Lucky City</h2><p>Lucky City — виртуальный игровой город для пользователей от 18 лет. В нём можно участвовать в мини-играх, получать внутриигровые награды, выполнять задания, развивать профиль, открывать оформления и сравнивать результаты в рейтингах. Ниже описаны основные принципы. Точные параметры ставок, множителей, наград и ограничений всегда отображаются в самой игре перед действием.</p><h3>1. Вход, профиль и сохранение прогресса</h3><p>Игра открывается во ВКонтакте. Игровой профиль связывается с идентификатором пользователя платформы. В профиле могут отображаться баланс, история игровой активности, достижения, награды, статистика и доступные настройки. Не передавайте доступ к своему аккаунту другим лицам. Если прогресс отображается неверно, сначала перезапустите игру, затем обратитесь в поддержку.</p><h3>2. Lucky Coins (LC) — внутриигровая валюта</h3><p>LC используются внутри Lucky City для ставок и других предусмотренных игрой действий. Баланс уменьшается при расходовании LC и увеличивается при начислении виртуальных наград. Перед подтверждением действия проверяйте его стоимость. LC не являются денежными средствами, не дают права на выплату денег или материальных призов и не подлежат обмену на реальные деньги.</p><h3>3. Plinko — шарики и множители</h3><p>В Plinko игрок выбирает размер ставки и количество шариков — например, 1, 5 или 10, если эти варианты доступны в текущей версии. Шарики проходят по игровому полю с препятствиями и попадают в нижние ячейки. Каждая ячейка имеет свой множитель. Итоговая виртуальная награда определяется результатами шариков и правилами расчёта ставки.</p><ul><li>Перед запуском проверьте, как рассчитывается стоимость выбранного количества шариков.</li><li>При нескольких шариках их движение может показываться последовательно или с перекрытием анимаций; внешний вид анимации не меняет рассчитанный результат.</li><li>Попадание в ячейку с низким множителем может привести к потере части поставленных LC.</li><li>Если баланс недостаточен, запуск не должен выполняться.</li></ul><h3>4. Mines — поле с минами</h3><p>В Mines игрок выбирает ставку и, если режим это позволяет, количество мин. На поле скрыты безопасные клетки и мины. Открывая безопасные клетки, игрок увеличивает доступный виртуальный выигрыш. Можно завершить раунд и забрать рассчитанную награду до попадания на мину. При открытии мины раунд завершается с потерей ставки. Чем больше открыто безопасных клеток, тем выше может быть множитель, но сохраняется риск проигрыша.</p><h3>5. Crash — растущий множитель</h3><p>В Crash раунд начинается со ставки LC. Множитель увеличивается до момента остановки. Задача игрока — успеть зафиксировать результат до завершения раунда. При успешном выводе награда рассчитывается по множителю в момент фиксации; если раунд закончился раньше, ставка теряется. Если доступен автовывод, можно заранее задать целевой множитель. Автовывод не гарантирует выигрыш: раунд может завершиться до достижения выбранного значения.</p><h3>6. Колесо наград и ежедневные возможности</h3><p>Lucky Wheel и другие доступные ежедневные механики позволяют получать виртуальные бонусы на условиях, показанных в игре. Возможность повторного получения награды может зависеть от времени ожидания, лимита попыток или выполнения задания. Наличие ежедневной награды не означает гарантированного получения конкретного приза.</p><h3>7. Другие мини-игры</h3><p>В зависимости от установленной версии Lucky City могут быть доступны слоты, рулетки и другие режимы. В слотах результат определяется комбинациями символов и правилами выплат; в рулетках — выбранными ставками и итоговым сектором или комбинацией. Перед игрой изучайте экран правил соответствующего режима, таблицу множителей, число линий и стоимость запуска. Если режим отсутствует в интерфейсе, он считается недоступным независимо от упоминания на этой странице.</p><h3>8. Задания, достижения и награды</h3><p>Задания могут требовать определённых действий: сыграть несколько раундов, посетить раздел, выполнить игровую цель или принять участие в событии. За выполнение могут начисляться LC, опыт, оформление или другие виртуальные награды. Учитываются только действия, отвечающие условиям задания. Прогресс, сроки, лимиты и размер награды отображаются в карточке задания. Достижения фиксируют определённые результаты игрока и не всегда дают дополнительную награду.</p><h3>9. Рейтинги и клубы</h3><p>Рейтинги позволяют сравнивать достижения участников по выбранному показателю: очкам, активности или другому критерию, указанному в игре. Некоторые рейтинги могут обновляться по сезонам. Если в игре доступны клубы, участие в них регулируется показанными правилами клуба и события. Запрещены попытки искусственно изменять рейтинг через ошибки сервиса или несанкционированное вмешательство.</p><h3>10. Оформления и персонализация</h3><p>Оформления изменяют внешний вид доступных элементов интерфейса или профиля. Они могут выдаваться за игровую активность, достижения, события или предоставляться как отдельные цифровые предложения. Косметическое оформление само по себе не гарантирует преимущество в игровых результатах. Проверяйте условия разблокировки в соответствующем разделе.</p><h3>11. Покупки за VK Голоса</h3><p>Если в Lucky City доступно платное цифровое предложение, его состав и стоимость должны быть указаны до оплаты. Оплата проводится через механизм VK Голосов. После успешной операции соответствующая виртуальная покупка должна отобразиться в игре согласно условиям предложения. При проблеме с начислением сохраните сведения о платеже и напишите в поддержку. Не отправляйте пароли и данные банковских карт.</p><h3>12. Честная игра и технические ошибки</h3><p>Запрещены вмешательство в работу игры, использование программ для изменения результатов, эксплуатация ошибок для получения необоснованных преимуществ, попытки получить доступ к чужим профилям и злоупотребление механиками. При техническом сбое не повторяйте многократно платную операцию, пока не проверите её статус. О найденной ошибке можно сообщить разработчику.</p><h3>13. Возраст, безопасность и ограничения</h3><p>Игра предназначена для лиц от 18 лет. Все ставки и выигрыши выражены только в виртуальных LC. Результаты игровых раундов могут быть неудачными; участие не гарантирует прирост баланса. Устанавливайте личные ограничения на время игры и расходы на цифровые покупки. При возникновении вопросов обратитесь на <a href="mailto:luckycity.vk@gmail.com">luckycity.vk@gmail.com</a>.</p><p class="note">Это подробное справочное руководство. Если интерфейс конкретной версии игры показывает другие доступные режимы, лимиты или коэффициенты, ориентируйтесь на актуальные условия, отображённые перед действием. Юридические условия использования находятся в отдельной вкладке.</p>`,
privacy:`<div class="tag">🔒 ПЕРСОНАЛЬНЫЕ ДАННЫЕ</div><h2>Конфиденциальность Lucky City</h2><p>В этом разделе объясняется, какие сведения могут использоваться для работы игры Lucky City, зачем они нужны и как обратиться по вопросам персональных данных.</p><h3>1. Сведения об операторе</h3><p>Оператор: Акимов Василий Евгеньевич, физическое лицо, применяющее специальный налоговый режим «Налог на профессиональный доход» (самозанятый). Местонахождение: Российская Федерация, Приморский край, Владивосток. Контакт для обращений: <a href="mailto:luckycity.vk@gmail.com">luckycity.vk@gmail.com</a>.</p><h3>2. Какие данные могут обрабатываться</h3><ul><li>Идентификатор пользователя ВКонтакте и сведения, передаваемые платформой при запуске мини-приложения, в пределах предоставленного доступа.</li><li>Данные игрового профиля: баланс LC, история операций, результаты раундов, достижения, задания, настройки и иные элементы прогресса.</li><li>Технические сведения, необходимые для безопасности и диагностики: время запросов, сообщения об ошибках, данные о сессиях и технические идентификаторы, если они фиксируются сервером.</li><li>Сведения о цифровой покупке: название предложения, статус начисления, идентификатор операции и другая информация, доступная через механизмы VK Голосов.</li><li>Информация, которую пользователь добровольно сообщает при обращении в поддержку.</li></ul><p>Перечень описывает возможные категории. Фактически обрабатываемые поля зависят от реализованных функций игры и должны быть сверены с сервером и настройками ВКонтакте.</p><h3>3. Для чего нужны сведения</h3><p>Для входа в игровой профиль, сохранения прогресса между посещениями, начисления и списания виртуальных LC, отображения рейтингов и достижений, выполнения цифровых покупок, предотвращения злоупотреблений, устранения ошибок и ответа на обращения игроков.</p><h3>4. Основания обработки</h3><p>Обработка должна осуществляться на предусмотренных законодательством РФ основаниях, в том числе когда она необходима для предоставления запрошенной игровой функции, исполнения применимых обязательств или основана на согласии пользователя в случаях, когда оно требуется. Конкретные основания для каждой категории данных подлежат проверке перед утверждением окончательной политики.</p><h3>5. Передача сведений и внешние сервисы</h3><p>Игра работает через платформу ВКонтакте. Для авторизации и оплаты цифровых предложений могут использоваться сервисы платформы. Для работы приложения также может применяться инфраструктура размещения и хранения данных. Список фактических поставщиков, их роли и условия передачи сведений необходимо подтвердить до утверждения документа. Продажа персональных данных игроков третьим лицам не заявляется.</p><h3>6. Хранение и защита</h3><p>Сведения должны храниться не дольше, чем необходимо для указанных целей, с учётом требований законодательства. Для защиты доступа к игровым данным применяются организационные и технические меры, соответствующие устройству сервиса. Конкретные сроки хранения, расположение баз данных, порядок резервного копирования и удаления требуют проверки по фактической инфраструктуре.</p><h3>7. Права пользователя</h3><p>Пользователь может направить запрос о доступе к своим данным, их уточнении, прекращении обработки или удалении в предусмотренных законом случаях, а также об отзыве согласия, если обработка основана на согласии. Для защиты профиля может потребоваться подтверждение принадлежности аккаунта заявителю. Некоторые сведения могут сохраняться в случаях, предусмотренных законодательством.</p><h3>8. Как отправить запрос</h3><p>Напишите на <a href="mailto:luckycity.vk@gmail.com">luckycity.vk@gmail.com</a> с темой «Персональные данные Lucky City». Укажите суть запроса и ссылку на игровой профиль VK, если это необходимо для поиска данных. Не отправляйте пароль, код подтверждения, реквизиты карты или документы без отдельного обоснованного запроса по защищённому каналу.</p><h3>9. Обновление документа</h3><p>Описание может уточняться при изменении функций Lucky City, состава обрабатываемых сведений и законодательства. Существенные изменения должны доводиться до сведения пользователей доступным способом.</p><p class="note"><strong>Статус: проект документа.</strong> Перед использованием в качестве окончательной политики необходимо проверить реальные данные, сроки и место хранения, правовые основания, подрядчиков, трансграничные передачи (если есть), меры защиты и требования законодательства РФ. Настоящий текст сам по себе не подтверждает выполнение этих требований.</p>`,
terms:`<div class="tag">📄 ПРАВИЛА ИСПОЛЬЗОВАНИЯ</div><h2>Условия использования Lucky City</h2><p>Ниже изложены условия пользования виртуальной развлекательной игрой Lucky City. Они дополняют описание механик в разделе «Правила игры».</p><h3>1. Сведения о проекте и связь</h3><p>Владелец проекта: Акимов Василий Евгеньевич, самозанятый (плательщик налога на профессиональный доход), Российская Федерация, Приморский край, Владивосток. Адрес для обращений: <a href="mailto:luckycity.vk@gmail.com">luckycity.vk@gmail.com</a>.</p><h3>2. Возрастное ограничение</h3><p>Lucky City предназначена для пользователей от 18 лет. Пользователь должен соблюдать возрастные требования и правила платформы ВКонтакте. Если пользователь не достиг установленного возраста, ему не следует пользоваться игрой.</p><h3>3. Игровой профиль</h3><p>Доступ к игре предоставляется через ВКонтакте. Пользователь отвечает за безопасность собственного аккаунта и не должен передавать его другим лицам. Доступность профиля и сохранение прогресса зависят от работоспособности платформы и игрового сервиса.</p><h3>4. Виртуальные Lucky Coins (LC)</h3><p>LC — исключительно внутриигровые единицы для участия в игровых режимах и других предусмотренных функциях. Они не являются денежными средствами, электронными деньгами, инвестиционным активом или средством платежа за пределами Lucky City. LC нельзя обменять на реальные деньги или материальные призы. Виртуальные результаты не гарантируют получения каких-либо доходов.</p><h3>5. Режимы, ставки и результаты</h3><p>В игре могут быть доступны Plinko, Mines, Crash, Lucky Wheel и другие мини-игры. Условия каждого режима, ставка, множители, количество попыток, доступные награды и ограничения должны отображаться в соответствующем интерфейсе. Участие может привести к уменьшению баланса LC. Анимация служит отображением игрового процесса и не должна рассматриваться как обещание определённого результата.</p><h3>6. Задания, рейтинги и награды</h3><p>Задания, события, достижения, рейтинги ества и препятствовать работе сервиса. При выявлении нарушений могут применяться соразмерные ограничения доступа с учётом обстоятельств и применимого законодательства.</p><h3>11. Техническая доступность</h3><p>Для обновлений, исправления ошибок и обеспечения безопасности могут проводиться технические работы. Временные сбои связи или платформы могут влиять на доступность игры. При спорном результате игрового действия пользователь вправе обратиться в поддержку для проверки доступных серверных записей.</p><h3>12. Интеллектуальные права</h3><p>Игровые тексты, изображения, интерфейс и программные элементы охраняются в пределах применимого законодательства. Пользователь не получает права распространять исходный код, обходить технические ограничения или выдавать материалы игры за собственные. Права на элементы сторонних сервисов сохраняются за соответствующими правообладателями.</p><h3>13. Персональные данные</h3><p>Сведения о возможной обработке данных приведены во вкладке «Конфиденциальность». Для запросов по данным используется адрес <a href="mailto:luckycity.vk@gmail.com">luckycity.vk@gmail.com</a>.</p><h3>14. Изменение условий и обращение в поддержку</h3><p>Условия могут обновляться по мере развития проекта. Существенные изменения должны публиковаться понятным способом. Вопросы по доступу, начислениям и работе игры направляйте в поддержку с описанием ситуации и временем события.</p><p class="note"><strong>Статус: проект условий.</strong> Перед официальным введением необходимо проверить фактические механики покупок, порядок заключения договора, возвратов, доступность возрастных ограничений и соответствие правилам VK и законодательству РФ. Этот текст не заменяет юридическую проверку.</p>`,
