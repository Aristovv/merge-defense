news:`<div class="tag">📰 НОВОСТИ</div><h2>Новости Lucky City</h2><p>Здесь собраны официальные объявления, обновления и важная информация для игроков.</p><h3>Следите за обновлениями</h3><p>Новые события и изменения публикуются в <a href="https://vk.ru/lucky_city_app">сообществе Lucky City</a>. Постоянная <a href="https://vk.ru/@lucky_city_app-novosti-lucky-city">статья «Новости»</a> также доступна во ВКонтакте.</p><p class="note">Информация о новых версиях появляется после их выпуска. Эта страница не объявляет тестовые изменения уже опубликованными.</p>`,
rules:`<div class="tag">🎮 РУКОВОДСТВО</div><h2>Правила игры</h2><p>Lucky City — развлекательная игра 18+ с виртуальными монетами Lucky Coins (LC).</p><h3>Plinko</h3><p>Выберите ставку и 1, 5 или 10 шариков. Результат каждого шарика определяется игровым сервером; выплата зависит от множителя.</p><h3>Mines</h3><p>Открывайте безопасные клетки и забирайте накопленную награду до попадания на мину.</p><h3>Crash</h3><p>Заберите выигрыш до остановки растущего множителя. Если раунд завершится раньше, ставка проигрывает.</p><h3>Lucky Wheel</h3><p>Ежедневное колесо виртуальных наград.</p><h3>Задания, рейтинги и клубы</h3><p>Выполняйте задания, получайте достижения, сравнивайте результаты и участвуйте в клубной жизни.</p>`,
privacy:`<div class="tag">🔒 ИНФОРМАЦИЯ</div><h2>Конфиденциальность</h2><p><strong>Оператор:</strong> Акимов Василий Евгеньевич, физическое лицо, применяющее специальный налоговый режим «Налог на профессиональный доход» (самозанятый), Российская Федерация, Приморский край, г. Владивосток.</p><p>Для работы Lucky City используются данные, необходимые для входа через ВКонтакте, идентификации игрового профиля и сохранения прогресса.</p><p>Игровые данные могут включать идентификатор игрока, баланс виртуальной валюты, историю игровых операций и достижения. При использовании платных возможностей могут также обрабатываться сведения о заказе, статусе оплаты и начислении покупки, полученные от платформы. Не следует направлять в поддержку пароли, коды подтверждения или реквизиты банковских карт.</p><h3>Обращения по персональным данным</h3><p>По адресу <a href="mailto:luckycity.vk@gmail.com">luckycity.vk@gmail.com</a> можно направить запрос о доступе к своим данным, уточнении неточных сведений, удалении данных или прекращении обработки в случаях, предусмотренных законодательством. Для защиты игрового аккаунта может потребоваться подтверждение принадлежности профиля заявителю.</p><p class="note">Это информационное описание, а не окончательная юридическая политика обработки персональных данных. Перед официальным использованием раздела необходимо проверить фактические категории данных, правовые основания и цели обработки, получателей данных, местонахождение и сроки хранения, порядок удаления и меры защиты, а также обязанности оператора по законодательству РФ.</p><p>По вопросам данных: <a href="mailto:luckycity.vk@gmail.com">luckycity.vk@gmail.com</a>.</p>`,
terms:`<div class="tag">📄 ИНФОРМАЦИЯ</div><h2>Условия использования</h2><p><strong>Владелец проекта:</strong> Акимов Василий Евгеньевич, самозанятый (плательщик налога на профессиональный доход), Российская Федерация, Приморский край, г. Владивосток.</p><p>Lucky City предназначена для пользователей от 18 лет. Пользуясь игрой, игрок подтверждает, что достиг 18 лет. Lucky Coins (LC) — виртуальная игровая валюта, не являющаяся денежными средствами.</p><p>В игре могут предлагаться платные цифровые игровые возможности и виртуальные предметы. Перед оплатой игроку должны быть показаны конкретный состав покупки, цена и способ оплаты. К платным цифровым игровым предложениям могут относиться виртуальная валюта LC, VIP-статусы, подписки, косметические оформления и другие игровые преимущества — только если конкретное предложение действительно доступно в игре. Состав, срок действия (если применимо), стоимость и условия каждого предложения указываются непосредственно перед покупкой.</p><p>Оплата цифровых игровых покупок осуществляется через VK Голоса в соответствии с правилами ВКонтакте. Перед подтверждением покупки игроку должны быть доступны её состав и стоимость в Голосах. Порядок обработки платежа, спорных операций и возвратов определяется применимыми правилами ВКонтакте и законодательством Российской Федерации. Если покупка оплачена, но не начислена, игрок может написать на <a href="mailto:luckycity.vk@gmail.com">luckycity.vk@gmail.com</a>, указав дату, приблизительное время, название предложения и идентификатор операции, если он доступен. Не отправляйте пароль, коды подтверждения или данные банковской карты. Запросы о возврате рассматриваются индивидуально с учётом правил VK Голосов и применимого законодательства РФ.</p><p>Результаты игровых режимов рассчитываются игровой системой. Использование ошибок и попытки вмешательства в работу сервиса могут привести к ограничениям доступа.</p><p class="note">Это предварительная информационная версия. Полное пользовательское соглашение должно быть утверждено владельцем игры перед использованием в качестве юридического документа.</p>`,
support:`<div class="tag">💬 ПОМОЩЬ</div><h2>Поддержка игроков</h2><p>Если возникла ошибка, не начислилась награда или не открывается игра, напишите нам.</p><h3>Как обратиться</h3><ul><li>Укажите название игрового режима.</li><li>Опишите, что произошло и когда.</li><li>По возможности приложите скриншот.</li><li>Никогда не присылайте пароли или коды подтверждения.</li></ul><p>Электронная почта: <a href="mailto:luckycity.vk@gmail.com">luckycity.vk@gmail.com</a></p><p>Сообщество: <a href="https://vk.ru/lucky_city_app">Lucky City во ВКонтакте</a></p>`
};
const keys=Object.keys(sections);const tabs=[...document.querySelectorAll('[role=tab]')];const panel=document.getElementById('content');
function activate(key,focus=false){if(!sections[key])key='news';tabs.forEach(b=>{const active=b.dataset.tab===key;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;if(active&&focus)b.focus()});panel.innerHTML=sections[key];panel.setAttribute('aria-labelledby','tab-'+key);if(location.hash!=='#'+key)history.replaceState(null,'','#'+key)}
tabs.forEach((b,i)=>{b.addEventListener('click',()=>activate(b.dataset.tab));b.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;activate(tabs[next].dataset.tab,true)})});addEventListener('hashchange',()=>activate(location.hash.slice(1)));activate(location.hash.slice(1));
</script></body></html>
